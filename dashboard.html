<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Manager - Dashboard</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --border: #e2e8f0;
      --primary: #0f172a;
      --primary-2: #1e293b;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #d97706;
      --info: #2563eb;
      --shadow: 0 20px 60px rgba(15, 23, 42, .09);
      --radius: 28px;
      --radius-sm: 18px;
    }

    :root.dark {
      --bg: #020617;
      --surface: #0f172a;
      --surface-2: #020617;
      --text: #f8fafc;
      --muted: #94a3b8;
      --muted-2: #64748b;
      --border: #1e293b;
      --primary: #ffffff;
      --primary-2: #e2e8f0;
      --shadow: 0 20px 70px rgba(0, 0, 0, .32);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    a { color: inherit; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .app { min-height: 100vh; padding-bottom: 112px; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: color-mix(in srgb, var(--surface) 85%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }

    .container { width: min(100% - 32px, 1240px); margin: 0 auto; }

    .topbar-inner {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .logo { width: 46px; height: 46px; border-radius: 18px; display: grid; place-items: center; background: var(--text); color: var(--bg); font-weight: 950; letter-spacing: -.04em; flex: 0 0 auto; }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: -.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; font-weight: 650; }

    .actions { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

    .btn {
      border: 0;
      border-radius: 16px;
      padding: 11px 14px;
      background: var(--text);
      color: var(--bg);
      font-weight: 900;
      font-size: 13px;
      transition: .18s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
    }
    .btn:hover { transform: translateY(-1px); opacity: .92; }
    .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn.danger { background: var(--danger); color: #fff; }
    .btn.success { background: var(--success); color: #fff; }
    .btn.warning { background: var(--warning); color: #fff; }
    .btn.small { min-height: 34px; padding: 8px 11px; border-radius: 13px; font-size: 12px; }
    .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }

    .main { padding: 26px 0; animation: enter .25s ease-out; }
    @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .welcome {
      margin-bottom: 22px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 22px;
      align-items: center;
    }

    .eyebrow { display: inline-flex; gap: 8px; align-items: center; color: var(--success); background: rgba(22, 163, 74, .1); border: 1px solid rgba(22, 163, 74, .2); border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 900; margin-bottom: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .welcome h2 { margin: 0; font-size: clamp(28px, 5vw, 42px); letter-spacing: -.055em; }
    .welcome p { margin: 8px 0 0; color: var(--muted); line-height: 1.6; }

    .mini-grid { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); gap: 10px; }
    .mini { border: 1px solid var(--border); background: var(--surface-2); border-radius: 20px; padding: 14px; }
    .mini span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 950; }
    .mini strong { display: block; margin-top: 6px; font-size: 14px; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .toolbar h3 { margin: 0; font-size: 24px; letter-spacing: -.04em; }
    .toolbar p { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
    .toolbar-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .grid { display: grid; gap: 16px; }
    .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 18px; }
    .stats.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 18px; box-shadow: 0 6px 24px rgba(15,23,42,.04); }
    .card .label { color: var(--muted); font-size: 12px; font-weight: 950; text-transform: uppercase; letter-spacing: .08em; }
    .card .value { margin-top: 9px; font-weight: 950; font-size: 28px; letter-spacing: -.05em; }
    .card .helper { margin-top: 4px; color: var(--muted-2); font-size: 12px; }

    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .control, input, select, textarea {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 16px;
      padding: 11px 13px;
      outline: none;
    }
    textarea { min-height: 90px; resize: vertical; width: 100%; }
    input:focus, select:focus, textarea:focus { box-shadow: 0 0 0 4px color-mix(in srgb, var(--text) 10%, transparent); }

    .tabs {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      gap: 8px;
      padding: 8px;
      border-radius: 24px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .tab { border: 0; background: transparent; color: var(--muted); border-radius: 18px; padding: 11px 14px; font-weight: 950; font-size: 13px; }
    .tab.active { background: var(--text); color: var(--bg); }

    .board { grid-template-columns: repeat(4, minmax(240px, 1fr)); align-items: start; }
    .column { min-height: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px; }
    .column-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .column-head h4 { margin: 0; }
    .count { border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); padding: 5px 10px; font-size: 12px; font-weight: 950; color: var(--muted); }
    .items { display: grid; gap: 10px; max-height: 550px; overflow-y: auto; padding-right: 2px; }
    .item-card { border: 1px solid var(--border); background: var(--surface-2); border-radius: 20px; padding: 14px; }
    .item-card h5 { margin: 0; font-size: 15px; letter-spacing: -.02em; }
    .item-card p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .item-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .price { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 9px; min-width: 0; }
    .price span { color: var(--muted-2); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; font-weight: 950; }
    .price strong { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

    .status-badge { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 6px 10px; font-size: 11px; font-weight: 950; border: 1px solid currentColor; }
    .Planned { color: #2563eb; background: rgba(37,99,235,.1); }
    .Pending { color: #d97706; background: rgba(217,119,6,.1); }
    .Purchased { color: #16a34a; background: rgba(22,163,74,.1); }
    .Cancelled { color: #dc2626; background: rgba(220,38,38,.1); }

    table { width: 100%; border-collapse: collapse; overflow: hidden; }
    th, td { padding: 13px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    td { font-size: 14px; }
    .table-wrap { width: 100%; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }

    .calendar { display: block; }
    .calendar-panel { overflow: hidden; }
    .calendar-hint {
      margin: -2px 0 16px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.5;
    }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
    .day-name {
      color: var(--muted-2);
      font-size: 12px;
      font-weight: 950;
      text-align: center;
      padding: 8px 0;
    }
    .day {
      border: 1px solid var(--border);
      background: var(--surface-2);
      height: 118px;
      min-height: 0;
      border-radius: 20px;
      padding: 10px;
      text-align: left;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
      position: relative;
      transition: .18s ease;
    }
    .day:not(.empty):hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--text) 28%, var(--border));
      box-shadow: 0 14px 30px rgba(15,23,42,.08);
    }
    .day.empty { opacity: 0; pointer-events: none; }
    .day.selected { background: var(--text); color: var(--bg); }
    .day.has-items { border-color: color-mix(in srgb, var(--info) 35%, var(--border)); }
    .day-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      flex: 0 0 auto;
    }
    .day-number { font-weight: 950; font-size: 15px; letter-spacing: -.03em; }
    .day-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      padding: 0 7px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      font-weight: 950;
      flex: 0 0 auto;
    }
    .day.selected .day-count {
      background: color-mix(in srgb, var(--bg) 18%, transparent);
      color: var(--bg);
      border-color: color-mix(in srgb, var(--bg) 25%, transparent);
    }
    .day-preview {
      display: grid;
      gap: 5px;
      min-height: 0;
      overflow: hidden;
    }
    .event-pill,
    .more-pill,
    .calendar-empty-day {
      display: block;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 900;
      line-height: 1.2;
    }
    .event-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .day.selected .event-pill {
      background: color-mix(in srgb, var(--bg) 16%, transparent);
      color: var(--bg);
      border-color: color-mix(in srgb, var(--bg) 22%, transparent);
    }
    .more-pill {
      color: var(--info);
      background: rgba(37,99,235,.1);
      border: 1px solid rgba(37,99,235,.16);
    }
    .day.selected .more-pill {
      color: var(--bg);
      background: color-mix(in srgb, var(--bg) 14%, transparent);
      border-color: color-mix(in srgb, var(--bg) 22%, transparent);
    }
    .calendar-empty-day {
      color: var(--muted-2);
      background: transparent;
      border: 1px dashed var(--border);
    }
    .date-modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .date-modal-list {
      display: grid;
      gap: 12px;
      max-height: 62vh;
      overflow-y: auto;
      padding-right: 3px;
    }
    .date-modal-card {
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 22px;
      padding: 14px;
    }
    .date-modal-card h4 {
      margin: 0;
      font-size: 16px;
      letter-spacing: -.025em;
    }
    .date-modal-card p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .two-col { grid-template-columns: 1fr 1fr; }
    .three-col { grid-template-columns: repeat(3, 1fr); }

    .empty { border: 1px dashed var(--border); border-radius: 22px; padding: 30px; text-align: center; color: var(--muted); background: var(--surface); }

    .modal-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(2,6,23,.62); display: grid; place-items: center; padding: 20px; }
    .modal { width: min(100%, 760px); max-height: 92vh; overflow: auto; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 30px; box-shadow: 0 30px 90px rgba(0,0,0,.35); }
    .modal.small { width: min(100%, 520px); }
    .modal-header { display: flex; justify-content: space-between; align-items: start; gap: 16px; padding: 22px; border-bottom: 1px solid var(--border); }
    .modal-header h3 { margin: 0; font-size: 24px; letter-spacing: -.04em; }
    .modal-header p { margin: 6px 0 0; color: var(--muted); }
    .modal-body { padding: 22px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 18px 22px; border-top: 1px solid var(--border); background: var(--surface-2); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 950; margin-bottom: 7px; }
    .form-field input, .form-field select, .form-field textarea { width: 100%; }

    .toast { position: fixed; right: 18px; bottom: 105px; z-index: 80; background: var(--text); color: var(--bg); border-radius: 18px; padding: 14px 16px; font-weight: 850; box-shadow: var(--shadow); max-width: min(420px, calc(100vw - 36px)); animation: enter .18s ease-out; }
    .loader { min-height: 100vh; display: grid; place-items: center; text-align: center; }
    .spinner { width: 46px; height: 46px; border-radius: 50%; border: 4px solid var(--border); border-top-color: var(--text); animation: spin .75s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    img.photo-preview { width: 100%; max-height: 260px; object-fit: contain; border-radius: 18px; border: 1px solid var(--border); background: var(--surface-2); }

    @media (max-width: 980px) {
      .welcome { grid-template-columns: 1fr; }
      .mini-grid, .stats, .stats.six, .board, .two-col, .three-col { grid-template-columns: 1fr 1fr; }
      .calendar-grid { gap: 8px; }
      .day { height: 108px; border-radius: 17px; padding: 8px; }
    }
    @media (max-width: 680px) {
      .container { width: min(100% - 22px, 1240px); }
      .topbar-inner { align-items: flex-start; flex-direction: column; padding: 14px 0; }
      .actions { width: 100%; justify-content: stretch; }
      .actions .btn { flex: 1; }
      .mini-grid, .stats, .stats.six, .board, .two-col, .three-col, .form-grid { grid-template-columns: 1fr; }
      .calendar-grid { grid-template-columns: repeat(7, minmax(42px, 1fr)); gap: 6px; overflow-x: auto; padding-bottom: 4px; }
      .day-name { font-size: 10px; }
      .day { height: 92px; min-width: 42px; border-radius: 14px; padding: 6px; }
      .event-pill, .more-pill, .calendar-empty-day { font-size: 9px; padding: 3px 6px; }
      .day-count { display: none; }
      .tabs { width: calc(100vw - 18px); overflow-x: auto; justify-content: flex-start; bottom: 10px; }
      .tab { white-space: nowrap; }
      .welcome h2 { font-size: 31px; }
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <div class="loader"><div><div class="spinner"></div><strong>Opening dashboard...</strong></div></div>
  </div>
  <div id="toast" class="toast" style="display:none"></div>
  <div id="modalRoot"></div>

  <script>
    'use strict';

    const API_URL = 'https://script.google.com/macros/s/AKfycbw4sFi0EVDSYlrDNV8Tgex60tjrDzNcxR4Amzn2KNwWQbQST2fi3qBfVEFsajWBErna/exec';

    const STORAGE_KEYS = {
      TOKEN: 'inventory_manager_token',
      USER: 'inventory_manager_user',
      THEME: 'inventory_manager_theme'
    };

    const STATUS_OPTIONS = ['Planned', 'Pending', 'Purchased', 'Cancelled'];
    const GENERAL_STATUS_OPTIONS = ['Active', 'Inactive'];
    const PHOTO_ACCEPT_TYPES = ['image/jpeg', 'image/png', 'image/webp'];

    const state = {
      token: '',
      user: null,
      appConfig: { name: 'Inventory Manager', version: '1.9.0', loginUrl: 'index.html' },
      branches: [],
      inventoryItems: [],
      categories: [],
      units: [],
      summary: null,
      settingsSummary: null,
      activeTab: 'checker',
      viewMode: 'board',
      selectedMonth: currentMonth(),
      selectedBranchId: 'ALL',
      selectedDate: today(),
      loading: true,
      refreshing: false
    };

    const app = document.getElementById('app');
    const modalRoot = document.getElementById('modalRoot');
    const toastEl = document.getElementById('toast');

    document.addEventListener('DOMContentLoaded', bootDashboard);

    async function gasRun(functionName, ...args) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ functionName, args }),
        redirect: 'follow'
      });

      if (!response.ok) throw new Error('HTTP error: ' + response.status);
      return response.json();
    }

    async function bootDashboard() {
      applyTheme(localStorage.getItem(STORAGE_KEYS.THEME) || 'light');

      try {
        const configResponse = await gasRun('getAppConfig');
        if (configResponse && configResponse.success && configResponse.app) {
          state.appConfig = Object.assign(state.appConfig, configResponse.app);
        }

        const token = localStorage.getItem(STORAGE_KEYS.TOKEN);
        if (!token) return redirectToLogin();

        const sessionResponse = await gasRun('validateSession', token);
        if (!sessionResponse || !sessionResponse.success) {
          clearSession();
          return redirectToLogin();
        }

        state.token = token;
        state.user = sessionResponse.user;
        localStorage.setItem(STORAGE_KEYS.USER, JSON.stringify(state.user));

        if (isAdmin()) state.selectedBranchId = state.user.branchId;

        await loadAllData(false);
      } catch (error) {
        renderError(error.message || 'Failed to open dashboard.');
      }
    }

    async function loadAllData(showMessage) {
      state.refreshing = true;
      renderApp();

      try {
        const dashboard = await gasRun('getDashboardData', state.token);
        if (!dashboard || !dashboard.success) throw new Error(dashboard ? dashboard.message : 'Failed to load dashboard.');

        const settings = await gasRun('getSettingsData', state.token).catch(function () { return null; });

        state.user = dashboard.user || state.user;
        state.branches = dashboard.branches || [];
        state.inventoryItems = normalizeItems(dashboard.inventoryChecker || []);
        state.categories = settings && settings.success ? settings.categories || [] : dashboard.categories || [];
        state.units = settings && settings.success ? settings.units || [] : dashboard.units || [];
        state.summary = dashboard.summary || buildLocalSummary(state.inventoryItems);
        state.settingsSummary = settings && settings.success ? settings.summary || null : null;
        state.loading = false;
        state.refreshing = false;

        if (isAdmin()) state.selectedBranchId = state.user.branchId;
        renderApp();
        if (showMessage) showToast('Dashboard refreshed.');
      } catch (error) {
        state.loading = false;
        state.refreshing = false;
        renderError(error.message || 'Failed to load dashboard.');
      }
    }

    async function refreshInventoryData() {
      state.refreshing = true;
      renderApp();

      try {
        const branchId = isAdmin() ? state.user.branchId : state.selectedBranchId;
        const response = await gasRun('getInventoryCheckerData', state.token, {
          month: state.selectedMonth,
          branchId: branchId && branchId !== 'ALL' ? branchId : ''
        });
        if (!response || !response.success) throw new Error(response ? response.message : 'Failed to refresh inventory.');

        state.inventoryItems = normalizeItems(response.items || []);
        state.categories = response.categories || state.categories;
        state.units = response.units || state.units;
        state.summary = Object.assign({}, state.summary || {}, {
          totalInventoryChecks: response.summary ? response.summary.total : state.inventoryItems.length,
          plannedChecks: response.summary ? response.summary.planned : countStatus(state.inventoryItems, 'Planned'),
          pendingChecks: response.summary ? response.summary.pending : countStatus(state.inventoryItems, 'Pending'),
          purchasedChecks: response.summary ? response.summary.purchased : countStatus(state.inventoryItems, 'Purchased'),
          cancelledChecks: response.summary ? response.summary.cancelled : countStatus(state.inventoryItems, 'Cancelled')
        });
        state.refreshing = false;
        renderApp();
      } catch (error) {
        state.refreshing = false;
        renderApp();
        showToast(error.message || 'Failed to refresh inventory.');
      }
    }

    async function refreshSettingsData() {
      try {
        const response = await gasRun('getSettingsData', state.token);
        if (!response || !response.success) throw new Error(response ? response.message : 'Failed to refresh settings.');
        state.categories = response.categories || [];
        state.units = response.units || [];
        state.settingsSummary = response.summary || null;
        renderApp();
      } catch (error) {
        showToast(error.message || 'Failed to refresh settings.');
      }
    }

    function renderApp() {
      if (state.loading) {
        app.innerHTML = '<div class="loader"><div><div class="spinner"></div><strong>Opening dashboard...</strong></div></div>';
        return;
      }
      if (!state.user) return redirectToLogin();

      app.innerHTML = `
        <header class="topbar">
          <div class="container topbar-inner">
            <div class="brand">
              <div class="logo">IM</div>
              <div>
                <h1>${esc(state.appConfig.name)}</h1>
                <p>Monthly branch inventory checker · v${esc(state.appConfig.version || '1.9.0')}</p>
              </div>
            </div>
            <div class="actions">
              <button class="btn secondary" data-action="refresh">${state.refreshing ? 'Refreshing...' : 'Refresh'}</button>
              <button class="btn secondary" data-action="theme">${isDark() ? 'Light' : 'Dark'}</button>
              <button class="btn" data-action="logout">Logout</button>
            </div>
          </div>
        </header>

        <main class="container main">
          ${welcomeHtml()}
          <section id="content">${contentHtml()}</section>
        </main>

        ${tabsHtml()}
      `;

      bindGlobalActions();
      bindContentActions();
    }

    function welcomeHtml() {
      const management = isManagement();
      return `
        <section class="panel welcome">
          <div>
            <div class="eyebrow"><span class="dot"></span> Login successful</div>
            <h2>Welcome, ${esc(state.user.name || state.user.username)}</h2>
            <p>${management ? 'You are managing inventory data across all branches.' : 'You are managing inventory purchases for ' + esc(state.user.branchName || 'your assigned branch') + '.'}</p>
          </div>
          <div class="mini-grid">
            <div class="mini"><span>Role</span><strong>${esc(state.user.role)}</strong></div>
            <div class="mini"><span>Access</span><strong>${management ? 'All Branches' : 'Assigned Branch'}</strong></div>
            <div class="mini"><span>Status</span><strong>${esc(state.user.status || 'Active')}</strong></div>
          </div>
        </section>
      `;
    }

    function tabsHtml() {
      const tabs = [
        ['overview', 'Overview'],
        ['checker', 'Checker'],
        ['reports', 'Reports'],
        ['settings', 'Settings']
      ];
      if (isManagement()) tabs.splice(1, 0, ['branches', 'Branches']);
      return `<nav class="tabs">${tabs.map(function (tab) {
        return `<button class="tab ${state.activeTab === tab[0] ? 'active' : ''}" data-tab="${tab[0]}">${tab[1]}</button>`;
      }).join('')}</nav>`;
    }

    function contentHtml() {
      if (state.activeTab === 'overview') return overviewHtml();
      if (state.activeTab === 'branches') return branchesHtml();
      if (state.activeTab === 'checker') return checkerHtml();
      if (state.activeTab === 'reports') return reportsHtml();
      if (state.activeTab === 'settings') return settingsHtml();
      return checkerHtml();
    }

    function overviewHtml() {
      const items = filteredItems();
      const activeCategories = state.categories.filter(isActive).length;
      const activeUnits = state.units.filter(isActive).length;
      const totalActual = sum(items, 'ActualPrice');
      const totalEstimated = sum(items, 'EstimatedPrice');
      const photoCount = items.filter(hasPhoto).length;

      return `
        <div class="grid stats">
          ${statCard('Branches', state.branches.length, 'Accessible branches')}
          ${statCard('Items', items.length, 'Filtered inventory')}
          ${statCard('Photos', photoCount, 'Drive proof files')}
          ${statCard('Master Data', activeCategories + '/' + activeUnits, 'Categories / Units')}
        </div>
        <div class="grid two-col">
          <section class="panel">
            <h3 style="margin:0;font-size:28px;letter-spacing:-.05em;">Inventory Checker</h3>
            <p style="color:var(--muted);line-height:1.65;margin-top:10px;">Plan monthly branch purchases, record estimated and actual prices, track purchase status, and upload compressed proof photos directly to Google Drive.</p>
            <button class="btn" data-go-tab="checker" style="margin-top:18px;">Open Checker</button>
          </section>
          <section class="panel">
            <p style="margin:0;color:var(--muted);font-weight:900;">Cost Summary</p>
            <h3 style="font-size:30px;margin:10px 0 0;letter-spacing:-.05em;">${money(totalActual)}</h3>
            <div class="grid two-col" style="margin-top:16px;">
              <div class="mini"><span>Estimated</span><strong>${money(totalEstimated)}</strong></div>
              <div class="mini"><span>Variance</span><strong>${money(totalActual - totalEstimated)}</strong></div>
            </div>
          </section>
        </div>
      `;
    }

    function checkerHtml() {
      const items = filteredItems();
      const activeCategories = state.categories.filter(isActive);
      const activeUnits = state.units.filter(isActive);
      const ready = activeCategories.length > 0 && activeUnits.length > 0;
      return `
        <section class="panel" style="margin-bottom:18px;">
          <div class="toolbar">
            <div>
              <h3>Inventory Checker</h3>
              <p>${isManagement() ? 'Management dashboard with all branch filtering.' : 'Admin dashboard for assigned branch only.'}</p>
              ${!ready ? '<p style="color:var(--danger);font-weight:900;">Category and Unit data is empty. Open Settings first.</p>' : ''}
            </div>
            <div class="toolbar-actions">
              <input type="month" id="monthFilter" value="${esc(state.selectedMonth)}">
              ${isManagement() ? branchFilterHtml() : ''}
              <select id="viewMode"><option value="board" ${state.viewMode === 'board' ? 'selected' : ''}>Board</option><option value="calendar" ${state.viewMode === 'calendar' ? 'selected' : ''}>Calendar</option></select>
              <button class="btn secondary" data-action="refresh-inventory">${state.refreshing ? 'Loading...' : 'Refresh'}</button>
              ${!ready && isManagement() ? '<button class="btn danger" data-go-tab="settings">Setup Settings</button>' : `<button class="btn" data-action="create-item" ${ready ? '' : 'disabled'}>+ Add Item</button>`}
            </div>
          </div>
        </section>
        <div class="grid stats six">
          ${statCard('Total', items.length, 'Items this month')}
          ${statCard('Planned', countStatus(items, 'Planned'), 'Purchase plans')}
          ${statCard('Pending', countStatus(items, 'Pending'), 'Need follow-up')}
          ${statCard('Purchased', countStatus(items, 'Purchased'), 'Done')}
          ${statCard('Photos', items.filter(hasPhoto).length, 'Proof uploaded')}
          ${statCard('Actual', money(sum(items, 'ActualPrice')), 'Real cost')}
        </div>
        ${state.viewMode === 'calendar' ? calendarHtml(items) : boardHtml(items)}
      `;
    }

    function branchFilterHtml() {
      return `<select id="branchFilter"><option value="ALL">All Branches</option>${state.branches.map(function (b) {
        return `<option value="${escAttr(b.BranchID)}" ${state.selectedBranchId === b.BranchID ? 'selected' : ''}>${esc(b.BranchName)}</option>`;
      }).join('')}</select>`;
    }

    function boardHtml(items) {
      const groups = {};
      STATUS_OPTIONS.forEach(function (s) { groups[s] = items.filter(function (item) { return item.Status === s; }); });
      return `<div class="grid board">${STATUS_OPTIONS.map(function (status) {
        return `<section class="column">
          <div class="column-head"><h4>${status}</h4><span class="count">${groups[status].length}</span></div>
          <div class="items">${groups[status].length ? groups[status].map(itemCardHtml).join('') : '<div class="empty">No items</div>'}</div>
        </section>`;
      }).join('')}</div>`;
    }

    function itemCardHtml(item) {
      return `<article class="item-card">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">
          <div style="min-width:0;">
            <h5>${esc(item.ItemName || '-')}</h5>
            <p>${esc(item.PurchaseDate || '-')} · ${esc(item.BranchName || '-')}</p>
          </div>
          ${statusBadge(item.Status)}
        </div>
        <div class="item-meta">
          <div class="price"><span>Estimated</span><strong>${money(item.EstimatedPrice)}</strong></div>
          <div class="price"><span>Actual</span><strong>${money(item.ActualPrice)}</strong></div>
        </div>
        <div class="item-actions">
          <button type="button" class="btn small secondary" data-action="detail-item" data-id="${escAttr(item.CheckID)}">Detail</button>
          <button type="button" class="btn small secondary" data-action="edit-item" data-id="${escAttr(item.CheckID)}">Edit</button>
          ${hasPhoto(item) ? `<a class="btn small" href="${escAttr(photoUrl(item))}" target="_blank" rel="noopener noreferrer">Photo</a>` : ''}
        </div>
      </article>`;
    }

    function calendarHtml(items) {
      const days = buildCalendar(state.selectedMonth);
      const byDate = {};

      items.forEach(function (item) {
        const key = dateOnly(item.PurchaseDate);
        if (!byDate[key]) byDate[key] = [];
        byDate[key].push(item);
      });

      return `<div class="calendar">
        <section class="panel calendar-panel">
          <div class="calendar-hint">
            Click a date to view the purchase list in a tidy pop-up. Calendar cells stay fixed so the grid will not stretch or overlap.
          </div>

          <div class="calendar-grid">
            ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function (d) {
              return `<div class="day-name">${d}</div>`;
            }).join('')}

            ${days.map(function (day) {
              if (!day.date) return '<button type="button" class="day empty" aria-hidden="true"></button>';

              const dayItems = byDate[day.date] || [];
              const hasItemsClass = dayItems.length ? ' has-items' : '';
              const selectedClass = state.selectedDate === day.date ? ' selected' : '';
              const preview = dayItems.length
                ? dayItems.slice(0, 2).map(function (item) {
                    return `<span class="event-pill">${hasPhoto(item) ? '📎 ' : ''}${esc(item.ItemName || 'Untitled item')}</span>`;
                  }).join('') + (dayItems.length > 2 ? `<span class="more-pill">+${dayItems.length - 2} more item(s)</span>` : '')
                : '<span class="calendar-empty-day">No items</span>';

              return `<button
                type="button"
                class="day${selectedClass}${hasItemsClass}"
                data-action="open-date"
                data-date="${escAttr(day.date)}"
                aria-label="Open ${escAttr(formatDate(day.date))}, ${dayItems.length} purchase item(s)"
              >
                <span class="day-top">
                  <span class="day-number">${day.num}</span>
                  ${dayItems.length ? `<span class="day-count">${dayItems.length}</span>` : ''}
                </span>
                <span class="day-preview">${preview}</span>
              </button>`;
            }).join('')}
          </div>
        </section>
      </div>`;
    }

    function branchesHtml() {
      if (!isManagement()) return '<section class="panel"><p>Only Management can manage branches.</p></section>';
      return `
        <section class="panel">
          <div class="toolbar"><div><h3>Branches</h3><p>Create and maintain branch master data.</p></div><button class="btn" data-action="create-branch">+ Add Branch</button></div>
          <div class="table-wrap"><table><thead><tr><th>Branch ID</th><th>Name</th><th>Address</th><th>Status</th><th>Action</th></tr></thead><tbody>
            ${state.branches.map(function (b) { return `<tr><td>${esc(b.BranchID)}</td><td><strong>${esc(b.BranchName)}</strong></td><td>${esc(b.Address || '-')}</td><td>${statusBadge(b.Status)}</td><td><button class="btn small secondary" data-action="edit-branch" data-id="${escAttr(b.BranchID)}">Edit</button> <button class="btn small warning" data-action="deactivate-branch" data-id="${escAttr(b.BranchID)}">Inactive</button> <button class="btn small danger" data-action="delete-branch" data-id="${escAttr(b.BranchID)}">Delete</button></td></tr>`; }).join('')}
          </tbody></table></div>
        </section>`;
    }

    function reportsHtml() {
      const items = filteredItems();
      return `
        <section class="panel">
          <div class="toolbar"><div><h3>Reports</h3><p>Filtered summary for ${esc(state.selectedMonth)}.</p></div><button class="btn secondary" data-action="export-csv">Export CSV</button></div>
          <div class="grid stats">
            ${statCard('Estimated', money(sum(items, 'EstimatedPrice')), 'Total estimated')}
            ${statCard('Actual', money(sum(items, 'ActualPrice')), 'Total actual')}
            ${statCard('Variance', money(sum(items, 'ActualPrice') - sum(items, 'EstimatedPrice')), 'Actual minus estimated')}
            ${statCard('Purchased', countStatus(items, 'Purchased'), 'Completed')}
          </div>
          <div class="table-wrap"><table><thead><tr><th>Date</th><th>Branch</th><th>Item</th><th>Category</th><th>Qty</th><th>Estimated</th><th>Actual</th><th>Status</th></tr></thead><tbody>${items.map(function (item) {
            return `<tr><td>${esc(item.PurchaseDate)}</td><td>${esc(item.BranchName)}</td><td><strong>${esc(item.ItemName)}</strong></td><td>${esc(item.Category)}</td><td>${esc(item.Quantity)} ${esc(item.Unit)}</td><td>${money(item.EstimatedPrice)}</td><td>${money(item.ActualPrice)}</td><td>${statusBadge(item.Status)}</td></tr>`;
          }).join('')}</tbody></table></div>
        </section>`;
    }

    function settingsHtml() {
      return `
        <div class="grid two-col">
          ${settingsPanel('Category', 'category', state.categories, 'CategoryID', 'CategoryName')}
          ${settingsPanel('Unit', 'unit', state.units, 'UnitID', 'UnitName')}
        </div>`;
    }

    function settingsPanel(title, type, rows, idKey, nameKey) {
      return `<section class="panel">
        <div class="toolbar"><div><h3>${title}</h3><p>${rows.length} data row(s)</p></div>${isManagement() ? `<button class="btn" data-action="create-${type}">+ Add</button>` : ''}</div>
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Status</th>${isManagement() ? '<th>Action</th>' : ''}</tr></thead><tbody>
          ${rows.map(function (row) { return `<tr><td>${esc(row[idKey])}</td><td><strong>${esc(row[nameKey])}</strong></td><td>${statusBadge(row.Status)}</td>${isManagement() ? `<td><button class="btn small secondary" data-action="edit-${type}" data-id="${escAttr(row[idKey])}">Edit</button> <button class="btn small warning" data-action="deactivate-${type}" data-id="${escAttr(row[idKey])}">Inactive</button> <button class="btn small danger" data-action="delete-${type}" data-id="${escAttr(row[idKey])}">Delete</button></td>` : ''}</tr>`; }).join('')}
        </tbody></table></div>
      </section>`;
    }

    function statCard(label, value, helper) {
      return `<div class="card"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="helper">${esc(helper || '')}</div></div>`;
    }

    function statusBadge(status) {
      const clean = esc(status || 'Active');
      return `<span class="status-badge ${clean}"><span class="dot"></span>${clean}</span>`;
    }

    function bindGlobalActions() {
      document.querySelectorAll('[data-tab]').forEach(function (button) {
        button.addEventListener('click', function () {
          state.activeTab = button.dataset.tab;
          renderApp();
        });
      });
      document.querySelectorAll('[data-go-tab]').forEach(function (button) {
        button.addEventListener('click', function () {
          state.activeTab = button.dataset.goTab;
          renderApp();
        });
      });
      const refresh = document.querySelector('[data-action="refresh"]');
      if (refresh) refresh.addEventListener('click', function () { loadAllData(true); });
      const theme = document.querySelector('[data-action="theme"]');
      if (theme) theme.addEventListener('click', toggleTheme);
      const logout = document.querySelector('[data-action="logout"]');
      if (logout) logout.addEventListener('click', handleLogout);
    }

    function bindContentActions() {
      const month = document.getElementById('monthFilter');
      if (month) month.addEventListener('change', function () { state.selectedMonth = month.value; state.selectedDate = month.value + '-01'; refreshInventoryData(); });
      const branch = document.getElementById('branchFilter');
      if (branch) branch.addEventListener('change', function () { state.selectedBranchId = branch.value; refreshInventoryData(); });
      const view = document.getElementById('viewMode');
      if (view) view.addEventListener('change', function () { state.viewMode = view.value; renderApp(); });

      document.querySelectorAll('[data-action]').forEach(function (element) {
        const action = element.dataset.action;
        if (['refresh', 'theme', 'logout'].indexOf(action) !== -1) return;

        element.addEventListener('click', function () {
          const id = element.dataset.id || '';
          const date = element.dataset.date || '';

          if (action === 'refresh-inventory') return refreshInventoryData();
          if (action === 'create-item') return openInventoryForm('create', null, state.selectedDate);
          if (action === 'create-item-date') return openInventoryForm('create', null, date);
          if (action === 'edit-item') return openInventoryForm('edit', findItem(id));
          if (action === 'detail-item') return openDetailModal(findItem(id));
          if (action === 'open-date') {
            state.selectedDate = date;
            renderApp();
            return openDateItemsModal(date);
          }
          if (action === 'select-date') { state.selectedDate = date; return renderApp(); }
          if (action === 'create-branch') return openBranchForm('create');
          if (action === 'edit-branch') return openBranchForm('edit', findBranch(id));
          if (action === 'delete-branch') return deleteBranch(findBranch(id));
          if (action === 'deactivate-branch') return deactivateBranch(findBranch(id));
          if (action === 'create-category') return openSimpleMasterForm('category', 'create');
          if (action === 'edit-category') return openSimpleMasterForm('category', 'edit', findCategory(id));
          if (action === 'delete-category') return deleteMaster('category', id);
          if (action === 'deactivate-category') return deactivateMaster('category', id);
          if (action === 'create-unit') return openSimpleMasterForm('unit', 'create');
          if (action === 'edit-unit') return openSimpleMasterForm('unit', 'edit', findUnit(id));
          if (action === 'delete-unit') return deleteMaster('unit', id);
          if (action === 'deactivate-unit') return deactivateMaster('unit', id);
          if (action === 'export-csv') return exportCsv();
        });
      });
    }

    function openDateItemsModal(dateValue) {
      const selectedDate = dateValue || state.selectedDate || today();
      state.selectedDate = selectedDate;

      const items = filteredItems().filter(function (item) {
        return dateOnly(item.PurchaseDate) === selectedDate;
      });

      openModal({
        title: formatDate(selectedDate),
        subtitle: items.length + ' purchase item(s) scheduled on this date.',
        hideSubmit: true,
        body: `<div class="date-modal-head">
          <div>
            <p style="margin:0;color:var(--muted);font-weight:850;">Selected date</p>
            <h3 style="margin:4px 0 0;font-size:24px;letter-spacing:-.04em;">${formatDate(selectedDate)}</h3>
          </div>
          <button type="button" class="btn" data-date-modal-action="add" data-date="${escAttr(selectedDate)}">+ Add Item</button>
        </div>
        <div class="date-modal-list">
          ${items.length ? items.map(dateModalItemHtml).join('') : '<div class="empty">No purchase plan on this date. Click + Add Item to create one.</div>'}
        </div>`,
        afterOpen: function () {
          modalRoot.querySelectorAll('[data-date-modal-action]').forEach(function (button) {
            button.addEventListener('click', function () {
              const action = button.dataset.dateModalAction;
              const id = button.dataset.id || '';
              const date = button.dataset.date || selectedDate;

              if (action === 'add') {
                closeModal();
                return openInventoryForm('create', null, date);
              }

              if (action === 'detail') {
                const item = findItem(id);
                closeModal();
                return openDetailModal(item);
              }

              if (action === 'edit') {
                const item = findItem(id);
                closeModal();
                return openInventoryForm('edit', item);
              }
            });
          });
        }
      });
    }

    function dateModalItemHtml(item) {
      return `<article class="date-modal-card">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;">
          <div style="min-width:0;">
            <h4>${esc(item.ItemName || '-')}</h4>
            <p>${esc(item.BranchName || '-')} · ${esc(item.Category || '-')} · ${esc(item.Quantity || 0)} ${esc(item.Unit || '')}</p>
          </div>
          ${statusBadge(item.Status)}
        </div>

        <div class="item-meta">
          <div class="price"><span>Estimated</span><strong>${money(item.EstimatedPrice)}</strong></div>
          <div class="price"><span>Actual</span><strong>${money(item.ActualPrice)}</strong></div>
        </div>

        <div class="item-actions">
          <button type="button" class="btn small secondary" data-date-modal-action="detail" data-id="${escAttr(item.CheckID)}">Detail</button>
          <button type="button" class="btn small secondary" data-date-modal-action="edit" data-id="${escAttr(item.CheckID)}">Edit</button>
          ${hasPhoto(item) ? `<a class="btn small" href="${escAttr(photoUrl(item))}" target="_blank" rel="noopener noreferrer">Photo</a>` : ''}
        </div>
      </article>`;
    }

    function openInventoryForm(mode, item, dateValue) {
      item = item || {};
      const creating = mode === 'create';
      const branchDefault = defaultBranch();
      const form = {
        checkId: item.CheckID || '',
        branchId: item.BranchID || branchDefault.branchId,
        branchName: item.BranchName || branchDefault.branchName,
        itemName: item.ItemName || '',
        category: item.Category || defaultCategory(),
        purchaseDate: item.PurchaseDate || dateValue || state.selectedDate || today(),
        quantity: item.Quantity || '',
        unit: item.Unit || defaultUnit(),
        estimatedPrice: item.EstimatedPrice || '',
        actualPrice: item.ActualPrice || '',
        vendor: item.Vendor || '',
        photoUrl: item.PhotoURL || '',
        photoFileId: item.PhotoFileID || '',
        photoFileName: item.PhotoFileName || '',
        photoMimeType: item.PhotoMimeType || '',
        photoSizeBytes: item.PhotoSizeBytes || 0,
        photoViewUrl: item.PhotoViewURL || '',
        status: item.Status || 'Planned',
        notes: item.Notes || ''
      };

      openModal({
        title: creating ? 'Add Inventory Item' : 'Edit Inventory Item',
        subtitle: creating ? 'Create a monthly purchase plan.' : 'Update this inventory checker item.',
        body: inventoryFormHtml(form),
        submitText: creating ? 'Save Item' : 'Update Item',
        onSubmit: async function (modalForm) {
          await submitInventoryForm(mode, form.checkId, modalForm);
        }
      });
    }

    function inventoryFormHtml(form) {
      return `<div class="form-grid">
        <div class="form-field ${isManagement() ? '' : 'full'}">
          <label>Branch</label>
          ${isManagement() ? `<select name="branchId" required>${state.branches.filter(isActive).map(function (b) { return `<option value="${escAttr(b.BranchID)}" ${form.branchId === b.BranchID ? 'selected' : ''}>${esc(b.BranchName)}</option>`; }).join('')}</select>` : `<input name="branchName" value="${escAttr(form.branchName)}" readonly><input type="hidden" name="branchId" value="${escAttr(form.branchId)}">`}
        </div>
        <div class="form-field"><label>Item Name</label><input name="itemName" value="${escAttr(form.itemName)}" required></div>
        <div class="form-field"><label>Category</label><select name="category" required>${state.categories.filter(isActive).map(function (c) { return `<option value="${escAttr(c.CategoryName)}" ${form.category === c.CategoryName ? 'selected' : ''}>${esc(c.CategoryName)}</option>`; }).join('')}</select></div>
        <div class="form-field"><label>Purchase Date</label><input name="purchaseDate" type="date" value="${escAttr(form.purchaseDate || today())}" required></div>
        <div class="form-field"><label>Quantity</label><input name="quantity" type="number" step="any" value="${escAttr(form.quantity)}" required></div>
        <div class="form-field"><label>Unit</label><select name="unit" required>${state.units.filter(isActive).map(function (u) { return `<option value="${escAttr(u.UnitName)}" ${form.unit === u.UnitName ? 'selected' : ''}>${esc(u.UnitName)}</option>`; }).join('')}</select></div>
        <div class="form-field"><label>Estimated Price</label><input name="estimatedPrice" inputmode="numeric" value="${escAttr(form.estimatedPrice)}"></div>
        <div class="form-field"><label>Actual Price</label><input name="actualPrice" inputmode="numeric" value="${escAttr(form.actualPrice)}"></div>
        <div class="form-field"><label>Vendor</label><input name="vendor" value="${escAttr(form.vendor)}"></div>
        <div class="form-field"><label>Status</label><select name="status">${STATUS_OPTIONS.map(function (s) { return `<option value="${s}" ${form.status === s ? 'selected' : ''}>${s}</option>`; }).join('')}</select></div>
        <div class="form-field full"><label>Photo Proof</label><input name="photoFile" type="file" accept="image/jpeg,image/png,image/webp"><input type="hidden" name="photoUrl" value="${escAttr(form.photoUrl)}"><input type="hidden" name="photoFileId" value="${escAttr(form.photoFileId)}"><input type="hidden" name="photoFileName" value="${escAttr(form.photoFileName)}"><input type="hidden" name="photoMimeType" value="${escAttr(form.photoMimeType)}"><input type="hidden" name="photoSizeBytes" value="${escAttr(form.photoSizeBytes)}"><input type="hidden" name="photoViewUrl" value="${escAttr(form.photoViewUrl)}">${hasPhoto(form) ? `<div style="margin-top:10px;"><img class="photo-preview" src="${escAttr(photoUrl(form))}" alt="Current photo"><label class="check" style="margin-top:8px;"><input type="checkbox" name="removePhoto" value="1"> Remove current photo</label></div>` : '<p style="color:var(--muted);font-size:13px;margin:8px 0 0;">JPG, PNG, or WEBP. The file will be compressed before upload.</p>'}</div>
        <div class="form-field full"><label>Notes</label><textarea name="notes">${esc(form.notes)}</textarea></div>
      </div>`;
    }

    async function submitInventoryForm(mode, checkId, modalForm) {
      const data = readForm(modalForm);
      const branchRecord = findBranch(data.branchId);
      if (branchRecord) data.branchName = branchRecord.BranchName;
      if (!isManagement()) data.branchName = state.user.branchName;

      const payload = {
        branchId: data.branchId,
        branchName: data.branchName,
        itemName: data.itemName,
        category: data.category,
        purchaseDate: data.purchaseDate,
        quantity: data.quantity,
        unit: data.unit,
        estimatedPrice: data.estimatedPrice,
        actualPrice: data.actualPrice,
        vendor: data.vendor,
        status: data.status,
        notes: data.notes
      };

      if (data.removePhoto) {
        Object.assign(payload, emptyPhotoFields());
      } else {
        Object.assign(payload, {
          photoUrl: data.photoUrl,
          photoFileId: data.photoFileId,
          photoFileName: data.photoFileName,
          photoMimeType: data.photoMimeType,
          photoSizeBytes: data.photoSizeBytes,
          photoViewUrl: data.photoViewUrl
        });
      }

      const fileInput = modalForm.elements.photoFile;
      if (fileInput && fileInput.files && fileInput.files[0]) {
        showToast('Compressing photo...');
        payload.photoUpload = await compressImage(fileInput.files[0]);
      }

      const response = mode === 'create'
        ? await gasRun('createInventoryCheck', state.token, payload)
        : await gasRun('updateInventoryCheck', state.token, checkId, payload);

      if (!response || !response.success) throw new Error(response ? response.message : 'Save failed.');
      closeModal();
      showToast(response.message || 'Saved.');
      if (response.items) state.inventoryItems = normalizeItems(response.items);
      await refreshInventoryData();
    }

    function openDetailModal(item) {
      if (!item) return;
      openModal({
        title: 'Inventory Detail',
        subtitle: (item.ItemName || '-') + ' · ' + (item.BranchName || '-'),
        hideSubmit: true,
        body: `<div class="grid two-col">
          <div class="mini"><span>Quantity</span><strong>${esc(item.Quantity || 0)} ${esc(item.Unit || '')}</strong></div>
          <div class="mini"><span>Category</span><strong>${esc(item.Category || '-')}</strong></div>
          <div class="mini"><span>Estimated</span><strong>${money(item.EstimatedPrice)}</strong></div>
          <div class="mini"><span>Actual</span><strong>${money(item.ActualPrice)}</strong></div>
          <div class="mini"><span>Vendor</span><strong>${esc(item.Vendor || '-')}</strong></div>
          <div class="mini"><span>Created By</span><strong>${esc(item.CreatedBy || '-')}</strong></div>
          <div class="mini"><span>Status</span><strong>${statusBadge(item.Status)}</strong></div>
          <div class="mini"><span>Date</span><strong>${esc(item.PurchaseDate || '-')}</strong></div>
          <div class="mini" style="grid-column:1/-1;"><span>Notes</span><strong>${esc(item.Notes || '-')}</strong></div>
        </div>
        ${hasPhoto(item) ? `<div style="margin-top:16px;"><img class="photo-preview" src="${escAttr(photoUrl(item))}" alt="Inventory proof"><div class="item-actions"><a class="btn" href="${escAttr(photoUrl(item))}" target="_blank" rel="noopener noreferrer">Open Drive Photo</a></div></div>` : ''}
        <div class="item-actions" style="justify-content:flex-end;margin-top:20px;">
          ${item.Status !== 'Purchased' ? `<button type="button" class="btn success" data-modal-action="status" data-status="Purchased">Mark Purchased</button>` : ''}
          <button type="button" class="btn secondary" data-modal-action="edit">Edit</button>
          <button type="button" class="btn danger" data-modal-action="delete">Delete</button>
        </div>`,
        afterOpen: function () {
          modalRoot.querySelectorAll('[data-modal-action]').forEach(function (button) {
            button.addEventListener('click', async function () {
              const action = button.dataset.modalAction;
              if (action === 'edit') { closeModal(); openInventoryForm('edit', item); }
              if (action === 'delete') { closeModal(); await deleteInventory(item); }
              if (action === 'status') { await quickStatus(item, button.dataset.status); }
            });
          });
        }
      });
    }

    async function quickStatus(item, status) {
      const response = await gasRun('updateInventoryCheckStatus', state.token, item.CheckID, status);
      if (!response || !response.success) return showToast(response ? response.message : 'Status update failed.');
      closeModal();
      showToast('Status updated.');
      await refreshInventoryData();
    }

    async function deleteInventory(item) {
      if (!item || !confirm('Delete this inventory item?')) return;
      const response = await gasRun('deleteInventoryCheck', state.token, item.CheckID);
      if (!response || !response.success) return showToast(response ? response.message : 'Delete failed.');
      showToast(response.message || 'Deleted.');
      await refreshInventoryData();
    }

    function openBranchForm(mode, branch) {
      branch = branch || { BranchID: '', BranchName: '', Address: '', Status: 'Active' };
      openModal({
        title: mode === 'create' ? 'Add Branch' : 'Edit Branch',
        subtitle: 'Branch master data.',
        small: true,
        body: `<div class="form-grid">
          <div class="form-field"><label>Branch ID</label><input name="branchId" value="${escAttr(branch.BranchID)}" ${mode === 'edit' ? 'readonly' : ''} placeholder="Auto if empty"></div>
          <div class="form-field"><label>Branch Name</label><input name="branchName" value="${escAttr(branch.BranchName)}" required></div>
          <div class="form-field full"><label>Address</label><input name="address" value="${escAttr(branch.Address || '')}"></div>
          <div class="form-field full"><label>Status</label><select name="status">${GENERAL_STATUS_OPTIONS.map(function (s) { return `<option value="${s}" ${branch.Status === s ? 'selected' : ''}>${s}</option>`; }).join('')}</select></div>
        </div>`,
        submitText: mode === 'create' ? 'Create Branch' : 'Update Branch',
        onSubmit: async function (form) {
          const data = readForm(form);
          const response = mode === 'create'
            ? await gasRun('createBranch', state.token, data)
            : await gasRun('updateBranch', state.token, branch.BranchID, data);
          if (!response || !response.success) throw new Error(response ? response.message : 'Save branch failed.');
          closeModal();
          showToast(response.message || 'Branch saved.');
          await loadAllData(false);
        }
      });
    }

    async function deleteBranch(branch) {
      if (!branch || !confirm('Delete this branch? If already used, backend will block deletion.')) return;
      const response = await gasRun('deleteBranch', state.token, branch.BranchID);
      if (!response || !response.success) return showToast(response ? response.message : 'Delete branch failed.');
      showToast(response.message || 'Branch deleted.');
      await loadAllData(false);
    }

    async function deactivateBranch(branch) {
      if (!branch || !confirm('Set this branch as inactive?')) return;
      const response = await gasRun('deactivateBranch', state.token, branch.BranchID);
      if (!response || !response.success) return showToast(response ? response.message : 'Deactivate branch failed.');
      showToast(response.message || 'Branch updated.');
      await loadAllData(false);
    }

    function openSimpleMasterForm(type, mode, row) {
      row = row || {};
      const isCategory = type === 'category';
      const idKey = isCategory ? 'CategoryID' : 'UnitID';
      const nameKey = isCategory ? 'CategoryName' : 'UnitName';
      const title = isCategory ? 'Category' : 'Unit';
      openModal({
        title: (mode === 'create' ? 'Add ' : 'Edit ') + title,
        subtitle: title + ' master data.',
        small: true,
        body: `<div class="form-grid">
          <div class="form-field"><label>${title} ID</label><input name="${isCategory ? 'categoryId' : 'unitId'}" value="${escAttr(row[idKey] || '')}" ${mode === 'edit' ? 'readonly' : ''} placeholder="Auto if empty"></div>
          <div class="form-field"><label>${title} Name</label><input name="${isCategory ? 'categoryName' : 'unitName'}" value="${escAttr(row[nameKey] || '')}" required></div>
          <div class="form-field full"><label>Status</label><select name="status">${GENERAL_STATUS_OPTIONS.map(function (s) { return `<option value="${s}" ${(row.Status || 'Active') === s ? 'selected' : ''}>${s}</option>`; }).join('')}</select></div>
        </div>`,
        submitText: mode === 'create' ? 'Create' : 'Update',
        onSubmit: async function (form) {
          const data = readForm(form);
          const fn = isCategory
            ? (mode === 'create' ? 'createCategory' : 'updateCategory')
            : (mode === 'create' ? 'createUnit' : 'updateUnit');
          const response = mode === 'create'
            ? await gasRun(fn, state.token, data)
            : await gasRun(fn, state.token, row[idKey], data);
          if (!response || !response.success) throw new Error(response ? response.message : 'Save failed.');
          closeModal();
          showToast(response.message || 'Saved.');
          await refreshSettingsData();
        }
      });
    }

    async function deleteMaster(type, id) {
      if (!confirm('Delete this ' + type + '? If already used, backend will block deletion.')) return;
      const fn = type === 'category' ? 'deleteCategory' : 'deleteUnit';
      const response = await gasRun(fn, state.token, id);
      if (!response || !response.success) return showToast(response ? response.message : 'Delete failed.');
      showToast(response.message || 'Deleted.');
      await refreshSettingsData();
    }

    async function deactivateMaster(type, id) {
      if (!confirm('Set this ' + type + ' as inactive?')) return;
      const fn = type === 'category' ? 'deactivateCategory' : 'deactivateUnit';
      const response = await gasRun(fn, state.token, id);
      if (!response || !response.success) return showToast(response ? response.message : 'Deactivate failed.');
      showToast(response.message || 'Updated.');
      await refreshSettingsData();
    }

    function openModal(options) {
      const bodyHtml = options.body || '';
      const contentHtml = options.hideSubmit
        ? `<div class="modal-body">${bodyHtml}</div>`
        : `<form id="modalForm">
            <div class="modal-body">${bodyHtml}</div>
            <div class="modal-footer">
              <button class="btn secondary" type="button" data-close-modal>Cancel</button>
              <button class="btn" type="submit" id="modalSubmit">${esc(options.submitText || 'Save')}</button>
            </div>
          </form>`;

      modalRoot.innerHTML = `<div class="modal-backdrop">
        <section class="modal ${options.small ? 'small' : ''}">
          <div class="modal-header">
            <div><h3>${esc(options.title || '')}</h3><p>${esc(options.subtitle || '')}</p></div>
            <button class="btn small secondary" type="button" data-close-modal>Close</button>
          </div>
          ${contentHtml}
        </section>
      </div>`;

      modalRoot.querySelectorAll('[data-close-modal]').forEach(function (button) {
        button.addEventListener('click', closeModal);
      });

      modalRoot.querySelector('.modal-backdrop').addEventListener('click', function (event) {
        if (event.target === event.currentTarget) closeModal();
      });

      const form = document.getElementById('modalForm');
      if (!options.hideSubmit && form) {
        form.addEventListener('submit', async function (event) {
          event.preventDefault();

          const button = document.getElementById('modalSubmit');
          button.disabled = true;
          button.textContent = 'Saving...';

          try {
            await options.onSubmit(form);
          } catch (error) {
            showToast(error.message || 'Save failed.');
          } finally {
            if (document.getElementById('modalSubmit')) {
              button.disabled = false;
              button.textContent = options.submitText || 'Save';
            }
          }
        });
      }

      if (typeof options.afterOpen === 'function') options.afterOpen();
    }

    function closeModal() { modalRoot.innerHTML = ''; }

    function readForm(form) {
      const data = {};
      Array.prototype.forEach.call(form.elements, function (el) {
        if (!el.name) return;
        if (el.type === 'file') return;
        if (el.type === 'checkbox') data[el.name] = el.checked ? el.value || true : '';
        else data[el.name] = el.value;
      });
      return data;
    }

    async function compressImage(file) {
      if (PHOTO_ACCEPT_TYPES.indexOf(file.type) === -1) {
        throw new Error('Invalid photo type. Please use JPG, PNG, or WEBP.');
      }
      const maxSize = 2 * 1024 * 1024;
      const attempts = [
        { max: 1100, quality: .72 },
        { max: 900, quality: .62 },
        { max: 720, quality: .55 },
        { max: 600, quality: .48 }
      ];
      for (let i = 0; i < attempts.length; i++) {
        const result = await canvasCompress(file, attempts[i].max, attempts[i].quality);
        if (result.sizeBytes <= maxSize || i === attempts.length - 1) return result;
      }
    }

    function canvasCompress(file, maxSide, quality) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onerror = function () { reject(new Error('Could not read photo.')); };
        reader.onload = function () {
          const img = new Image();
          img.onerror = function () { reject(new Error('Could not process photo.')); };
          img.onload = function () {
            let width = img.width;
            let height = img.height;
            if (width > height && width > maxSide) { height = Math.round(height * (maxSide / width)); width = maxSide; }
            else if (height > maxSide) { width = Math.round(width * (maxSide / height)); height = maxSide; }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const mimeType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
            const dataUrl = canvas.toDataURL(mimeType, quality);
            const base64Data = dataUrl.split(',')[1] || '';
            resolve({
              base64Data: base64Data,
              mimeType: mimeType,
              fileName: file.name.replace(/\.[^.]+$/, '') + (mimeType === 'image/png' ? '.png' : '.jpg'),
              sizeBytes: Math.round(base64Data.length * 3 / 4)
            });
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function exportCsv() {
      const items = filteredItems();
      const headers = ['PurchaseDate','BranchName','ItemName','Category','Quantity','Unit','EstimatedPrice','ActualPrice','Vendor','Status','Notes','PhotoURL'];
      const rows = [headers].concat(items.map(function (item) { return headers.map(function (key) { return item[key] || ''; }); }));
      const csv = rows.map(function (row) { return row.map(csvCell).join(','); }).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'inventory-report-' + state.selectedMonth + '.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function csvCell(value) { return '"' + String(value == null ? '' : value).replace(/"/g, '""') + '"'; }

    async function handleLogout() {
      const token = state.token;
      clearSession();
      try { await gasRun('logout', token); } catch (error) {}
      redirectToLogin();
    }

    function redirectToLogin() { window.location.href = state.appConfig.loginUrl || 'index.html'; }
    function clearSession() { localStorage.removeItem(STORAGE_KEYS.TOKEN); localStorage.removeItem(STORAGE_KEYS.USER); }
    function applyTheme(theme) { document.documentElement.classList.toggle('dark', theme === 'dark'); localStorage.setItem(STORAGE_KEYS.THEME, theme); }
    function toggleTheme() { applyTheme(isDark() ? 'light' : 'dark'); renderApp(); }
    function isDark() { return document.documentElement.classList.contains('dark'); }
    function isManagement() { return state.user && String(state.user.role || '').toLowerCase() === 'management' && String(state.user.branchId || '').toUpperCase() === 'ALL'; }
    function isAdmin() { return state.user && String(state.user.role || '').toLowerCase() === 'admin' && String(state.user.branchId || '').toUpperCase() !== 'ALL'; }
    function isActive(row) { return String(row.Status || '').toLowerCase() === 'active'; }
    function normalizeItems(items) { return (items || []).map(function (item) { item.PurchaseDate = dateOnly(item.PurchaseDate); item.Status = item.Status || 'Planned'; return item; }); }
    function filteredItems() { return state.inventoryItems.filter(function (item) { const sameMonth = state.selectedMonth ? dateOnly(item.PurchaseDate).slice(0,7) === state.selectedMonth : true; const branchId = isAdmin() ? state.user.branchId : state.selectedBranchId; const sameBranch = !branchId || branchId === 'ALL' || item.BranchID === branchId; return sameMonth && sameBranch; }); }
    function findItem(id) { return state.inventoryItems.find(function (item) { return item.CheckID === id; }); }
    function findBranch(id) { return state.branches.find(function (b) { return b.BranchID === id; }); }
    function findCategory(id) { return state.categories.find(function (c) { return c.CategoryID === id; }); }
    function findUnit(id) { return state.units.find(function (u) { return u.UnitID === id; }); }
    function defaultBranch() { if (isAdmin()) return { branchId: state.user.branchId, branchName: state.user.branchName }; const b = state.branches.find(isActive) || state.branches[0] || {}; return { branchId: b.BranchID || '', branchName: b.BranchName || '' }; }
    function defaultCategory() { const c = state.categories.find(isActive); return c ? c.CategoryName : ''; }
    function defaultUnit() { const u = state.units.find(isActive); return u ? u.UnitName : ''; }
    function countStatus(items, status) { return items.filter(function (item) { return item.Status === status; }).length; }
    function sum(items, key) { return items.reduce(function (total, item) { return total + Number(item[key] || 0); }, 0); }
    function buildLocalSummary(items) { return { totalInventoryChecks: items.length, plannedChecks: countStatus(items,'Planned'), pendingChecks: countStatus(items,'Pending'), purchasedChecks: countStatus(items,'Purchased'), cancelledChecks: countStatus(items,'Cancelled') }; }
    function hasPhoto(item) { return Boolean(item && (item.PhotoViewURL || item.PhotoURL || item.photoViewUrl || item.photoUrl)); }
    function photoUrl(item) { return item.PhotoViewURL || item.PhotoURL || item.photoViewUrl || item.photoUrl || ''; }
    function emptyPhotoFields() { return { photoUrl: '', photoFileId: '', photoFileName: '', photoMimeType: '', photoSizeBytes: 0, photoViewUrl: '' }; }
    function currentMonth() { return new Date().toISOString().slice(0,7); }
    function today() { return new Date().toISOString().slice(0,10); }
    function dateOnly(value) { if (!value) return ''; if (Object.prototype.toString.call(value) === '[object Date]') return value.toISOString().slice(0,10); return String(value).slice(0,10); }
    function formatDate(value) { if (!value) return '-'; const date = new Date(value + 'T00:00:00'); if (isNaN(date)) return value; return date.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }); }
    function money(value) { const n = Number(value || 0); return new Intl.NumberFormat('id-ID', { style:'currency', currency:'IDR', maximumFractionDigits: 0 }).format(n); }
    function buildCalendar(month) { const first = new Date(month + '-01T00:00:00'); const year = first.getFullYear(); const m = first.getMonth(); const startDay = first.getDay(); const daysInMonth = new Date(year, m + 1, 0).getDate(); const days = []; for (let i=0;i<startDay;i++) days.push({date:'',num:''}); for (let d=1; d<=daysInMonth; d++) { const date = year + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0'); days.push({date:date,num:d}); } while (days.length % 7 !== 0) days.push({date:'',num:''}); return days; }
    function showToast(message) { toastEl.textContent = message; toastEl.style.display = 'block'; clearTimeout(showToast.timer); showToast.timer = setTimeout(function () { toastEl.style.display = 'none'; }, 3200); }
    function renderError(message) { app.innerHTML = `<div class="loader"><div class="panel"><h2>Dashboard error</h2><p style="color:var(--muted);">${esc(message)}</p><div style="margin-top:18px;"><button class="btn" onclick="location.href='index.html'">Back to Login</button></div></div></div>`; }
    function esc(value) { return String(value == null ? '' : value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    function escAttr(value) { return esc(value).replace(/`/g, '&#096;'); }
  </script>
</body>
</html>
