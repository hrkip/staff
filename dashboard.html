<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inventory Manager - Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            app: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page-enter {
      animation: pageEnter 0.25s ease-out;
    }

    .dock-enter {
      animation: dockEnter 0.25s ease-out;
    }

    .thin-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .thin-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .thin-scroll::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.35);
      border-radius: 999px;
    }

    .thin-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.55);
    }

    @keyframes pageEnter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes dockEnter {
      from {
        opacity: 0;
        transform: translate(-50%, 16px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }
  </style>
</head>

<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    const STORAGE_KEYS = {
      TOKEN: 'inventory_manager_token',
      USER: 'inventory_manager_user',
      THEME: 'inventory_manager_theme',
      DASHBOARD_CACHE: 'inventory_manager_dashboard_cache',
      BRANCH_CACHE: 'inventory_manager_branch_cache',
      SETTINGS_CACHE: 'inventory_manager_settings_cache',
      INVENTORY_CACHE_PREFIX: 'inventory_manager_inventory_cache_'
    };

    const CACHE_TTL_MS = 10 * 60 * 1000;

    const STATUS_OPTIONS = ['Planned', 'Pending', 'Purchased', 'Cancelled'];
    const GENERAL_STATUS_OPTIONS = ['Active', 'Inactive'];
    const BRANCH_STATUS_OPTIONS = ['Active', 'Inactive'];

    const PHOTO_ACCEPT_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
    const PHOTO_MAX_COMPRESSED_BYTES = 2 * 1024 * 1024;
    const PHOTO_COMPRESSION_ATTEMPTS = [
      { maxWidth: 900, maxHeight: 900, quality: 0.62 },
      { maxWidth: 720, maxHeight: 720, quality: 0.55 },
      { maxWidth: 600, maxHeight: 600, quality: 0.48 }
    ];

    const EMPTY_INVENTORY_FORM = {
      checkId: '',
      branchId: '',
      branchName: '',
      itemName: '',
      category: '',
      purchaseDate: getTodayDate(),
      quantity: '',
      unit: '',
      estimatedPrice: '',
      actualPrice: '',
      vendor: '',
      photoUrl: '',
      photoFileId: '',
      photoFileName: '',
      photoMimeType: '',
      photoSizeBytes: 0,
      photoViewUrl: '',
      photoUpload: null,
      photoPreviewUrl: '',
      photoSizeLabel: '',
      status: 'Planned',
      notes: ''
    };

    const EMPTY_BRANCH_FORM = {
      branchId: '',
      branchName: '',
      address: '',
      status: 'Active'
    };

    const EMPTY_CATEGORY_FORM = {
      categoryId: '',
      categoryName: '',
      status: 'Active'
    };

    const EMPTY_UNIT_FORM = {
      unitId: '',
      unitName: '',
      status: 'Active'
    };

    // Paste your new Google Apps Script Web App URL here after you deploy it
    const API_URL = "https://script.google.com/macros/s/AKfycbwRbMy3R5nkaGy5GbER-5btpH88HJdNMHtkxMpuOYIvmwp9nakpD835o9buQW7F4Umo/exec"; 

    async function gasRun(functionName, ...args) {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain', 
          },
          body: JSON.stringify({ functionName, args }),
          redirect: 'follow'
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        return await response.json();
      } catch (error) {
        console.error("API Error:", error);
        throw error;
      }
    }

    function App() {
      const savedTheme = localStorage.getItem(STORAGE_KEYS.THEME) || 'light';

      const [theme, setTheme] = useState(savedTheme);
      const [activeDock, setActiveDock] = useState('checker');

      const [appConfig, setAppConfig] = useState({
        name: 'Inventory Manager',
        version: '1.8.0',
        loginUrl: ''
      });

      const [state, setState] = useState({
        loading: true,
        saving: false,
        deleting: false,
        refreshing: false,
        fromCache: false,
        token: '',
        user: null,
        branches: [],
        inventoryItems: [],
        categories: [],
        units: [],
        settingsSummary: null,
        summary: null,
        error: '',
        toast: ''
      });

      const [viewMode, setViewMode] = useState('board');
      const [selectedMonth, setSelectedMonth] = useState(getCurrentMonth());
      const [selectedBranchId, setSelectedBranchId] = useState('ALL');

      const [inventoryFormOpen, setInventoryFormOpen] = useState(false);
      const [inventoryFormMode, setInventoryFormMode] = useState('create');
      const [inventoryForm, setInventoryForm] = useState(EMPTY_INVENTORY_FORM);

      const [detailOpen, setDetailOpen] = useState(false);
      const [selectedDetailItem, setSelectedDetailItem] = useState(null);

      const [branchFormOpen, setBranchFormOpen] = useState(false);
      const [branchFormMode, setBranchFormMode] = useState('create');
      const [branchForm, setBranchForm] = useState(EMPTY_BRANCH_FORM);

      const [categoryFormOpen, setCategoryFormOpen] = useState(false);
      const [categoryFormMode, setCategoryFormMode] = useState('create');
      const [categoryForm, setCategoryForm] = useState(EMPTY_CATEGORY_FORM);

      const [unitFormOpen, setUnitFormOpen] = useState(false);
      const [unitFormMode, setUnitFormMode] = useState('create');
      const [unitForm, setUnitForm] = useState(EMPTY_UNIT_FORM);

      const [calendarSelectedDate, setCalendarSelectedDate] = useState(getTodayDate());

      useEffect(() => {
        applyTheme(theme);
      }, [theme]);

      useEffect(() => {
        bootDashboard();
      }, []);

      useEffect(() => {
        if (!state.loading && state.token) {
          refreshInventoryData({ useCacheFirst: true });
        }
      }, [selectedMonth, selectedBranchId]);

      function applyTheme(selectedTheme) {
        if (selectedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          document.body.className = 'bg-slate-950';
        } else {
          document.documentElement.classList.remove('dark');
          document.body.className = 'bg-slate-100';
        }

        localStorage.setItem(STORAGE_KEYS.THEME, selectedTheme);
      }

      function toggleTheme() {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      }

      function isManagementUser(user) {
        return user &&
          String(user.role || '').trim().toLowerCase() === 'management' &&
          String(user.branchId || '').trim().toUpperCase() === 'ALL';
      }

      function isAdminUser(user) {
        return user &&
          String(user.role || '').trim().toLowerCase() === 'admin' &&
          String(user.branchId || '').trim().toUpperCase() !== 'ALL';
      }

      async function bootDashboard() {
        try {
          const configResponse = await gasRun('getAppConfig');

          if (configResponse && configResponse.success) {
            setAppConfig(configResponse.app);
          }

          const token = localStorage.getItem(STORAGE_KEYS.TOKEN);

          if (!token) {
            redirectToLogin(configResponse);
            return;
          }

          const sessionResponse = await gasRun('validateSession', token);

          if (!sessionResponse || !sessionResponse.success) {
            clearStoredSession();
            clearAllCache();
            redirectToLogin(configResponse);
            return;
          }

          const sessionUser = sessionResponse.user;
          const isAdmin = isAdminUser(sessionUser);

          if (isAdmin) {
            setSelectedBranchId(sessionUser.branchId);
          }

          const cachedDashboard = readCache(STORAGE_KEYS.DASHBOARD_CACHE);
          const cacheMatchesSession = cachedDashboard &&
            cachedDashboard.user &&
            isSameSessionUser(cachedDashboard.user, sessionUser);

          if (cacheMatchesSession) {
            const cachedUser = cachedDashboard.user;
            const cachedIsAdmin = isAdminUser(cachedUser);

            setState(prev => ({
              ...prev,
              loading: false,
              fromCache: true,
              token,
              user: cachedUser,
              branches: cachedDashboard.branches || [],
              inventoryItems: normalizeInventoryItems(cachedDashboard.inventoryChecker || []),
              categories: cachedDashboard.categories || [],
              units: cachedDashboard.units || [],
              settingsSummary: cachedDashboard.settingsSummary || null,
              summary: cachedDashboard.summary || null,
              error: ''
            }));

            if (cachedIsAdmin) {
              setSelectedBranchId(cachedUser.branchId);
            }
          }

          const dashboardResponse = await gasRun('getDashboardData', token);

          if (!dashboardResponse || !dashboardResponse.success) {
            if (!cacheMatchesSession) {
              setState(prev => ({
                ...prev,
                loading: false,
                token,
                user: sessionResponse.user,
                error: dashboardResponse ? dashboardResponse.message : 'Failed to load dashboard data.'
              }));
            }
            return;
          }

          const settingsResponse = await gasRun('getSettingsData', token);

          const categories = settingsResponse && settingsResponse.success
            ? settingsResponse.categories || []
            : dashboardResponse.categories || [];

          const units = settingsResponse && settingsResponse.success
            ? settingsResponse.units || []
            : dashboardResponse.units || [];

          const settingsSummary = settingsResponse && settingsResponse.success
            ? settingsResponse.summary || null
            : null;

          const fullDashboardData = {
            ...dashboardResponse,
            inventoryChecker: normalizeInventoryItems(dashboardResponse.inventoryChecker || []),
            categories,
            units,
            settingsSummary
          };

          localStorage.setItem(STORAGE_KEYS.USER, JSON.stringify(dashboardResponse.user));
          writeCache(STORAGE_KEYS.DASHBOARD_CACHE, fullDashboardData);
          writeCache(STORAGE_KEYS.BRANCH_CACHE, {
            branches: dashboardResponse.branches || []
          });
          writeCache(STORAGE_KEYS.SETTINGS_CACHE, {
            categories,
            units,
            summary: settingsSummary
          });

          const user = dashboardResponse.user;
          const userIsAdmin = isAdminUser(user);

          setState({
            loading: false,
            saving: false,
            deleting: false,
            refreshing: false,
            fromCache: false,
            token,
            user: user,
            branches: dashboardResponse.branches || [],
            inventoryItems: normalizeInventoryItems(dashboardResponse.inventoryChecker || []),
            categories,
            units,
            settingsSummary,
            summary: dashboardResponse.summary || null,
            error: '',
            toast: ''
          });

          if (userIsAdmin) {
            setSelectedBranchId(user.branchId);
          }

        } catch (error) {
          const cachedDashboard = readCache(STORAGE_KEYS.DASHBOARD_CACHE);
          const storedUser = readStoredUser();

          if (
            cachedDashboard &&
            cachedDashboard.user &&
            storedUser &&
            isSameSessionUser(cachedDashboard.user, storedUser)
          ) {
            setState(prev => ({
              ...prev,
              loading: false,
              fromCache: true,
              token: localStorage.getItem(STORAGE_KEYS.TOKEN) || '',
              user: cachedDashboard.user,
              branches: cachedDashboard.branches || [],
              inventoryItems: normalizeInventoryItems(cachedDashboard.inventoryChecker || []),
              categories: cachedDashboard.categories || [],
              units: cachedDashboard.units || [],
              settingsSummary: cachedDashboard.settingsSummary || null,
              summary: cachedDashboard.summary || null,
              error: ''
            }));

            if (isAdminUser(cachedDashboard.user)) {
              setSelectedBranchId(cachedDashboard.user.branchId);
            }

            return;
          }

          clearStoredSession();

          setState(prev => ({
            ...prev,
            loading: false,
            error: error.message || 'Failed to open dashboard.'
          }));
        }
      }

      async function refreshAllData() {
        if (!state.token) return;

        setState(prev => ({
          ...prev,
          refreshing: true
        }));

        try {
          const dashboardResponse = await gasRun('getDashboardData', state.token);

          if (!dashboardResponse || !dashboardResponse.success) {
            showToast(dashboardResponse ? dashboardResponse.message : 'Failed to refresh dashboard.');
            return;
          }

          const settingsResponse = await gasRun('getSettingsData', state.token);

          const categories = settingsResponse && settingsResponse.success
            ? settingsResponse.categories || []
            : dashboardResponse.categories || state.categories;

          const units = settingsResponse && settingsResponse.success
            ? settingsResponse.units || []
            : dashboardResponse.units || state.units;

          const settingsSummary = settingsResponse && settingsResponse.success
            ? settingsResponse.summary || null
            : state.settingsSummary;

          const fullDashboardData = {
            ...dashboardResponse,
            inventoryChecker: normalizeInventoryItems(dashboardResponse.inventoryChecker || []),
            categories,
            units,
            settingsSummary
          };

          writeCache(STORAGE_KEYS.DASHBOARD_CACHE, fullDashboardData);
          writeCache(STORAGE_KEYS.BRANCH_CACHE, {
            branches: dashboardResponse.branches || []
          });
          writeCache(STORAGE_KEYS.SETTINGS_CACHE, {
            categories,
            units,
            summary: settingsSummary
          });

          setState(prev => ({
            ...prev,
            refreshing: false,
            fromCache: false,
            user: dashboardResponse.user,
            branches: dashboardResponse.branches || [],
            inventoryItems: normalizeInventoryItems(dashboardResponse.inventoryChecker || []),
            categories,
            units,
            settingsSummary,
            summary: dashboardResponse.summary || prev.summary
          }));

          if (isAdminUser(dashboardResponse.user)) {
            setSelectedBranchId(dashboardResponse.user.branchId);
          }

          showToast('Dashboard refreshed.');

        } catch (error) {
          showToast(error.message || 'Failed to refresh dashboard.');

          setState(prev => ({
            ...prev,
            refreshing: false
          }));
        }
      }

      async function refreshInventoryData(options = {}) {
        if (!state.token) return;

        const effectiveBranchId = isAdminUser(state.user)
          ? state.user.branchId
          : selectedBranchId;

        const cacheKey = getInventoryCacheKey(selectedMonth, effectiveBranchId);

        if (options.useCacheFirst) {
          const cachedInventory = readCache(cacheKey);

          if (cachedInventory && cachedInventory.items) {
            setInventoryItemsFromResponse(cachedInventory.items, cachedInventory.summary);
          }
        }

        setState(prev => ({
          ...prev,
          refreshing: true
        }));

        try {
          const response = await gasRun('getInventoryCheckerData', state.token, {
            month: selectedMonth,
            branchId: effectiveBranchId !== 'ALL' ? effectiveBranchId : ''
          });

          if (!response || !response.success) {
            showToast(response ? response.message : 'Failed to reload inventory data.');
            return;
          }

          writeCache(cacheKey, {
            items: normalizeInventoryItems(response.items || []),
            summary: response.summary || null
          });

          setInventoryItemsFromResponse(normalizeInventoryItems(response.items || []), response.summary);

          setState(prev => ({
            ...prev,
            categories: response.categories || prev.categories,
            units: response.units || prev.units
          }));

        } catch (error) {
          showToast(error.message || 'Failed to reload inventory data.');
        } finally {
          setState(prev => ({
            ...prev,
            refreshing: false
          }));
        }
      }

      async function refreshSettingsData(options = {}) {
        if (!state.token) return;

        if (options.useCacheFirst) {
          const cachedSettings = readCache(STORAGE_KEYS.SETTINGS_CACHE);

          if (cachedSettings) {
            setState(prev => ({
              ...prev,
              categories: cachedSettings.categories || [],
              units: cachedSettings.units || [],
              settingsSummary: cachedSettings.summary || null
            }));
          }
        }

        setState(prev => ({
          ...prev,
          refreshing: true
        }));

        try {
          const response = await gasRun('getSettingsData', state.token);

          if (!response || !response.success) {
            showToast(response ? response.message : 'Failed to reload settings.');
            return;
          }

          writeCache(STORAGE_KEYS.SETTINGS_CACHE, {
            categories: response.categories || [],
            units: response.units || [],
            summary: response.summary || null
          });

          setState(prev => ({
            ...prev,
            categories: response.categories || [],
            units: response.units || [],
            settingsSummary: response.summary || null
          }));

        } catch (error) {
          showToast(error.message || 'Failed to reload settings.');
        } finally {
          setState(prev => ({
            ...prev,
            refreshing: false
          }));
        }
      }

      function setInventoryItemsFromResponse(items, summary) {
        const normalizedItems = normalizeInventoryItems(items || []);

        setState(prev => ({
          ...prev,
          inventoryItems: normalizedItems,
          summary: {
            ...(prev.summary || {}),
            totalInventoryChecks: summary ? summary.total : normalizedItems.length,
            plannedChecks: summary ? summary.planned : countStatus(normalizedItems, 'Planned'),
            pendingChecks: summary ? summary.pending : countStatus(normalizedItems, 'Pending'),
            purchasedChecks: summary ? summary.purchased : countStatus(normalizedItems, 'Purchased'),
            cancelledChecks: summary ? summary.cancelled : countStatus(normalizedItems, 'Cancelled')
          }
        }));
      }

      function redirectToLogin(configResponse) {
        const loginUrl = configResponse &&
          configResponse.success &&
          configResponse.app.loginUrl
          ? configResponse.app.loginUrl
          : 'index.html'; // Changed to point directly to physical file

        window.top.location.href = loginUrl;
      }

      async function handleLogout() {
        const token = state.token;

        clearStoredSession();
        clearAllCache();

        try {
          const response = await gasRun('logout', token);
          window.top.location.href = response.redirectUrl || appConfig.loginUrl || 'index.html';
        } catch (error) {
          window.top.location.href = appConfig.loginUrl || 'index.html';
        }
      }

      function getDefaultBranchForInventoryForm() {
        if (isAdminUser(state.user)) {
          return {
            branchId: state.user.branchId,
            branchName: state.user.branchName
          };
        }

        const activeBranch = state.branches.find(branch => branch.Status === 'Active');
        const branch = activeBranch || state.branches[0];

        if (branch) {
          return {
            branchId: branch.BranchID,
            branchName: branch.BranchName
          };
        }

        return {
          branchId: '',
          branchName: ''
        };
      }

      function getDefaultCategoryName() {
        const activeCategory = state.categories.find(category => category.Status === 'Active');
        return activeCategory ? activeCategory.CategoryName : '';
      }

      function getDefaultUnitName() {
        const activeUnit = state.units.find(unit => unit.Status === 'Active');
        return activeUnit ? activeUnit.UnitName : '';
      }

      function openCreateInventoryForm(dateValue) {
        const defaultBranch = getDefaultBranchForInventoryForm();

        setInventoryForm({
          ...EMPTY_INVENTORY_FORM,
          purchaseDate: dateValue || calendarSelectedDate || getTodayDate(),
          branchId: defaultBranch.branchId,
          branchName: defaultBranch.branchName,
          category: getDefaultCategoryName(),
          unit: getDefaultUnitName()
        });

        setInventoryFormMode('create');
        setInventoryFormOpen(true);
      }

      function openEditInventoryForm(item) {
        const normalizedItem = normalizeInventoryItem(item);

        setInventoryForm({
          checkId: normalizedItem.CheckID,
          branchId: normalizedItem.BranchID,
          branchName: normalizedItem.BranchName,
          itemName: normalizedItem.ItemName,
          category: normalizedItem.Category,
          purchaseDate: normalizedItem.PurchaseDate || getTodayDate(),
          quantity: normalizedItem.Quantity || '',
          unit: normalizedItem.Unit,
          estimatedPrice: normalizedItem.EstimatedPrice || '',
          actualPrice: normalizedItem.ActualPrice || '',
          vendor: normalizedItem.Vendor,
          photoUrl: normalizedItem.PhotoURL,
          photoFileId: normalizedItem.PhotoFileID,
          photoFileName: normalizedItem.PhotoFileName,
          photoMimeType: normalizedItem.PhotoMimeType,
          photoSizeBytes: normalizedItem.PhotoSizeBytes || 0,
          photoViewUrl: normalizedItem.PhotoViewURL,
          photoUpload: null,
          photoPreviewUrl: '',
          photoSizeLabel: normalizedItem.PhotoSizeBytes ? formatBytes(normalizedItem.PhotoSizeBytes) : '',
          status: normalizedItem.Status || 'Planned',
          notes: normalizedItem.Notes
        });

        setInventoryFormMode('edit');
        setInventoryFormOpen(true);
      }

      function closeInventoryForm() {
        setInventoryFormOpen(false);
        setInventoryForm(EMPTY_INVENTORY_FORM);
        setInventoryFormMode('create');
      }

      function updateInventoryForm(field, value) {
        setInventoryForm(prev => ({
          ...prev,
          [field]: value
        }));
      }

      function handlePhotoSelected(photoData) {
        setInventoryForm(prev => ({
          ...prev,
          photoUpload: {
            base64Data: photoData.base64Data,
            mimeType: photoData.mimeType,
            fileName: photoData.fileName,
            sizeBytes: photoData.sizeBytes
          },
          photoPreviewUrl: photoData.previewUrl,
          photoFileId: '',
          photoFileName: photoData.fileName,
          photoMimeType: photoData.mimeType,
          photoSizeBytes: photoData.sizeBytes,
          photoViewUrl: '',
          photoSizeLabel: formatBytes(photoData.sizeBytes)
        }));
      }

      function handlePhotoRemoved() {
        setInventoryForm(prev => ({
          ...prev,
          photoUrl: '',
          photoFileId: '',
          photoFileName: '',
          photoMimeType: '',
          photoSizeBytes: 0,
          photoViewUrl: '',
          photoUpload: null,
          photoPreviewUrl: '',
          photoSizeLabel: ''
        }));
      }

      function openDetail(item) {
        setSelectedDetailItem(item);
        setDetailOpen(true);
      }

      function closeDetail() {
        setDetailOpen(false);
        setSelectedDetailItem(null);
      }

      function handleDetailEdit(item) {
        closeDetail();
        openEditInventoryForm(item);
      }

      async function handleSubmitInventoryForm(event) {
        event.preventDefault();

        setState(prev => ({
          ...prev,
          saving: true
        }));

        try {
          let photoFields = {
            photoUrl: inventoryForm.photoUrl,
            photoFileId: inventoryForm.photoFileId,
            photoFileName: inventoryForm.photoFileName,
            photoMimeType: inventoryForm.photoMimeType,
            photoSizeBytes: inventoryForm.photoSizeBytes,
            photoViewUrl: inventoryForm.photoViewUrl
          };

          if (inventoryForm.photoUpload) {
            showToast('Uploading photo to Google Drive...');

            const uploadResponse = await gasRun('uploadInventoryPhoto', state.token, {
              base64Data: inventoryForm.photoUpload.base64Data,
              mimeType: inventoryForm.photoUpload.mimeType,
              fileName: inventoryForm.photoUpload.fileName,
              branchId: inventoryForm.branchId,
              branchName: inventoryForm.branchName,
              itemName: inventoryForm.itemName,
              checkId: inventoryFormMode === 'edit' ? inventoryForm.checkId : ''
            });

            if (!uploadResponse || !uploadResponse.success) {
              showToast(uploadResponse ? uploadResponse.message : 'Photo upload failed.');
              return;
            }

            photoFields = {
              photoUrl: uploadResponse.photoUrl || '',
              photoFileId: uploadResponse.photoFileId || '',
              photoFileName: uploadResponse.photoFileName || inventoryForm.photoFileName || '',
              photoMimeType: uploadResponse.photoMimeType || inventoryForm.photoMimeType || '',
              photoSizeBytes: uploadResponse.photoSizeBytes || inventoryForm.photoSizeBytes || 0,
              photoViewUrl: uploadResponse.photoViewUrl || ''
            };

            if (uploadResponse.photoShareError) {
              showToast(uploadResponse.photoShareError);
            } else {
              showToast('Photo uploaded. Saving item...');
            }
          }

          const payload = {
            branchId: inventoryForm.branchId,
            branchName: inventoryForm.branchName,
            itemName: inventoryForm.itemName,
            category: inventoryForm.category,
            purchaseDate: inventoryForm.purchaseDate,
            quantity: inventoryForm.quantity,
            unit: inventoryForm.unit,
            estimatedPrice: inventoryForm.estimatedPrice,
            actualPrice: inventoryForm.actualPrice,
            vendor: inventoryForm.vendor,
            photoUrl: photoFields.photoUrl,
            photoFileId: photoFields.photoFileId,
            photoFileName: photoFields.photoFileName,
            photoMimeType: photoFields.photoMimeType,
            photoSizeBytes: photoFields.photoSizeBytes,
            photoViewUrl: photoFields.photoViewUrl,
            status: inventoryForm.status,
            notes: inventoryForm.notes
          };

          const response = inventoryFormMode === 'create'
            ? await gasRun('createInventoryCheck', state.token, payload)
            : await gasRun('updateInventoryCheck', state.token, inventoryForm.checkId, payload);

          if (!response || !response.success) {
            showToast(response ? response.message : 'Save failed.');
            return;
          }

          showToast(inventoryForm.photoUpload ? 'Saved with Drive photo.' : (response.message || 'Saved.'));

          if (response.items) {
            const nextItems = normalizeInventoryItems(response.items);

            setState(prev => ({
              ...prev,
              inventoryItems: nextItems,
              categories: response.categories || prev.categories,
              units: response.units || prev.units
            }));

            syncInventoryCaches(nextItems);

          } else if (response.item) {
            upsertInventoryItem(normalizeInventoryItem(response.item));
          }

          closeInventoryForm();
          await refreshInventoryData();

        } catch (error) {
          showToast(error.message || 'Save failed.');
        } finally {
          setState(prev => ({
            ...prev,
            saving: false
          }));
        }
      }

      function upsertInventoryItem(item) {
        item = normalizeInventoryItem(item);

        setState(prev => {
          const existingIndex = prev.inventoryItems.findIndex(row => row.CheckID === item.CheckID);
          let nextItems = [];

          if (existingIndex >= 0) {
            nextItems = prev.inventoryItems.map(row => row.CheckID === item.CheckID ? item : row);
          } else {
            nextItems = [item, ...prev.inventoryItems];
          }

          syncInventoryCaches(nextItems);

          return {
            ...prev,
            inventoryItems: nextItems
          };
        });
      }

      async function handleDeleteInventory(item) {
        const confirmed = window.confirm('Delete this inventory checker item?');

        if (!confirmed) return;

        setState(prev => ({
          ...prev,
          deleting: true
        }));

        try {
          const response = await gasRun('deleteInventoryCheck', state.token, item.CheckID);

          if (!response || !response.success) {
            showToast(response ? response.message : 'Delete failed.');
            return;
          }

          showToast(response.message || 'Deleted.');

          if (response.items) {
            const nextItems = normalizeInventoryItems(response.items);

            setState(prev => ({
              ...prev,
              inventoryItems: nextItems
            }));
            syncInventoryCaches(nextItems);
          } else {
            setState(prev => {
              const nextItems = prev.inventoryItems.filter(row => row.CheckID !== item.CheckID);
              syncInventoryCaches(nextItems);

              return {
                ...prev,
                inventoryItems: nextItems
              };
            });
          }

          closeDetail();
          await refreshInventoryData();

        } catch (error) {
          showToast(error.message || 'Delete failed.');
        } finally {
          setState(prev => ({
            ...prev,
            deleting: false
          }));

          if (!response || !response.success) {

            return;

          if (response.items) {
            const nextItems = normalizeInventoryItems(response.items);

            setState(prev => ({

              inventoryItems: nextItems,
              categories: response.categories || prev.categories,
              units: response.units || prev.units

            syncInventoryCaches(nextItems);
          } else if (response.item) {

          }

          showToast(error.message || 'Failed to update status.');

      function syncInventoryCaches(items) {
        const effectiveBranchId = isAdminUser(state.user)
          ? state.user.branchId
          : selectedBranchId;

        const currentKey = getInventoryCacheKey(selectedMonth, effectiveBranchId);
        const currentItems = (items || []).filter(item => {
          const itemMonth = String(item.PurchaseDate || '').substring(0, 7);
          const sameMonth = selectedMonth ? itemMonth === selectedMonth : true;
          const sameBranch = effectiveBranchId === 'ALL' || item.BranchID === effectiveBranchId;

          return sameMonth && sameBranch;
        });

        writeCache(currentKey, {
          items: currentItems,
          summary: buildLocalInventorySummary(currentItems)
        });
      }

      const activeCategories = categories.filter(category => category.Status === 'Active').length;

    function InventorySummaryCards({ items }) {
      const summary = STATUS_OPTIONS.reduce((acc, status) => {
        acc[status] = items.filter(item => item.Status === status).length;
        return acc;
      }, {});

      const totalEstimated = items.reduce((sum, item) => sum + Number(item.EstimatedPrice || 0), 0);
      const totalActual = items.reduce((sum, item) => sum + Number(item.ActualPrice || 0), 0);
      const withPhoto = items.filter(item => item.PhotoURL).length;

      return (
        <div className="grid grid-cols-2 md:grid-cols-6 gap-4">
          <StatCard label="Total" value={items.length} helper="Items this month" />
          <StatCard label="Planned" value={summary.Planned || 0} helper="Purchase plans" />
          <StatCard label="Pending" value={summary.Pending || 0} helper="Need follow-up" />
          <StatCard label="Purchased" value={summary.Purchased || 0} helper="Done" />
          <StatCard label="Photos" value={withPhoto} helper="Proof uploaded" />
          <StatCard label="Actual" value={formatCurrencyCompact(totalActual)} helper="Real cost" />
        </div>
      );
    }

    function BoardView({ boardGroups, onOpenDetail }) {

        <div className="grid grid-cols-1 xl:grid-cols-4 gap-4">

                  {status}

                  {boardGroups[status] ? boardGroups[status].length : 0}
                </span>
              </div>

              <div className="space-y-2 h-[520px] overflow-y-auto thin-scroll pr-1">
                {(!boardGroups[status] || boardGroups[status].length === 0) && (
                  <div className="rounded-3xl border border-dashed border-slate-300 p-5 text-center text-sm text-slate-400 dark:border-slate-700">

                {(boardGroups[status] || []).map(item => (

              <h5 className="text-sm font-black truncate">

                {item.PurchaseDate} · {item.BranchName}

          <div className="grid grid-cols-2 gap-2 mt-3">
            <CompactPrice label="Est." value={item.EstimatedPrice} />
            <CompactPrice label="Act." value={item.ActualPrice} />

    function CompactPrice({ label, value }) {
      return (
        <div className="rounded-xl bg-white border border-slate-200 px-2 py-2 dark:bg-slate-900 dark:border-slate-800">
          <p className="text-[10px] text-slate-400 font-black">

          </p>

          <p className="text-xs font-black truncate">

    function CalendarView({
      selectedMonth,
      selectedDate,
      items,
      onDateChange,
      onCreate,
      onOpenDetail
    }) {
      const days = buildCalendarDays(selectedMonth);

      const itemsByDate = items.reduce((acc, item) => {
        const dateKey = normalizeDateOnly(item.PurchaseDate);

        if (!acc[dateKey]) acc[dateKey] = [];
        acc[dateKey].push(item);

        return acc;
      }, {});

      const selectedItems = itemsByDate[selectedDate] || [];

      return (
        <div className="grid grid-cols-1 xl:grid-cols-3 gap-4">
          <div className="xl:col-span-2 rounded-[2rem] border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
            <div className="grid grid-cols-7 gap-2 mb-2">
              {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
                <div key={day} className="text-center text-xs font-black text-slate-400 py-2">
                  {day}
                </div>
              ))}
            </div>

            <div className="grid grid-cols-7 gap-2">
              {days.map((day, index) => {
                const dayItems = day.date ? itemsByDate[day.date] || [] : [];
                const isSelected = day.date === selectedDate;
                const isToday = day.date === getTodayDate();

                return (
                  <button
                    key={index}
                    disabled={!day.date}
                    onClick={() => day.date && onDateChange(day.date)}
                    className={
                      'h-[128px] rounded-3xl border p-2 text-left transition overflow-hidden ' +
                      (
                        !day.date
                          ? 'border-transparent bg-transparent cursor-default'
                          : isSelected
                            ? 'border-slate-950 bg-slate-950 text-white dark:border-white dark:bg-white dark:text-slate-950'
                            : 'border-slate-200 bg-slate-50 hover:bg-slate-100 dark:border-slate-800 dark:bg-slate-950 dark:hover:bg-slate-800'
                      )
                    }
                  >
                    {day.date && (
                      <div className="h-full flex flex-col min-w-0">
                        <div className="flex items-center justify-between mb-1 shrink-0">
                          <span className="text-sm font-black">
                            {day.dayNumber}
                          </span>

                          {isToday && (
                            <span className={
                              'rounded-full px-2 py-0.5 text-[9px] font-black ' +
                              (
                                isSelected
                                  ? 'bg-white/20 text-white dark:bg-slate-950/10 dark:text-slate-950'
                                  : 'bg-green-50 text-green-700 dark:bg-green-500/10 dark:text-green-300'
                              )
                            }>
                              Today
                            </span>
                          )}
                        </div>

                        <div className="space-y-1 overflow-y-auto thin-scroll pr-1">
                          {dayItems.map(item => (
                            <div
                              key={item.CheckID}
                              className={
                                'truncate rounded-xl px-2 py-1 text-[10px] font-bold ' +
                                (
                                  isSelected
                                    ? 'bg-white/15'
                                    : 'bg-white text-slate-600 dark:bg-slate-900 dark:text-slate-300'
                                )
                              }
                            >
                              {hasInventoryPhoto(item) ? '📎 ' : ''}{item.ItemName} · {formatCurrencyCompact(item.ActualPrice || item.EstimatedPrice)}
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </button>
                );
              })}
            </div>
          </div>

          <div className="rounded-[2rem] border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900">
            <div className="flex items-center justify-between gap-3 mb-4">
              <div>
                <h4 className="font-black">
                  {formatDisplayDate(selectedDate)}
                </h4>

                <p className="text-sm text-slate-500 dark:text-slate-400">
                  {selectedItems.length} purchase item(s)
                </p>
              </div>

              <button
                onClick={() => onCreate(selectedDate)}
                className="rounded-2xl bg-slate-950 px-4 py-2 text-sm font-bold text-white dark:bg-white dark:text-slate-950"
              >
                + Add
              </button>
            </div>

            <div className="space-y-2 max-h-[560px] overflow-y-auto thin-scroll pr-1">
              {selectedItems.length === 0 && (
                <div className="rounded-3xl border border-dashed border-slate-300 p-6 text-center text-sm text-slate-400 dark:border-slate-700">
                  No purchase plan on this date.
                </div>
              )}

              {selectedItems.map(item => (
                <CompactInventoryCard
                  key={item.CheckID}
                  item={item}
                  onOpenDetail={onOpenDetail}
                />
              ))}
            </div>
          </div>
        </div>
      );

                      {item.PhotoFileName}

              {item.Status !== 'Purchased' && (

                  Mark Purchased

                  className="rounded-2xl bg-amber-500 px-4 py-2 text-sm font-black text-white hover:bg-amber-600"

              {item.Status !== 'Cancelled' && (
                <button
                  onClick={() => onQuickStatus(item, 'Cancelled')}
                  className="rounded-2xl bg-red-500 px-4 py-2 text-sm font-black text-white hover:bg-red-600"
                >

              <button
                onClick={() => onEdit(item)}
                className="rounded-2xl border border-slate-300 px-4 py-2 text-sm font-black text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:text-slate-200 dark:hover:bg-slate-800"
              >

              <button
                onClick={() => onDelete(item)}
                className="rounded-2xl border border-red-200 bg-red-50 px-4 py-2 text-sm font-black text-red-700 hover:bg-red-100 dark:bg-red-500/10 dark:border-red-500/20 dark:text-red-300"
              >
                Delete
              </button>
            </div>
          </div>
        </ModalShell>
      );

    function PhotoUploadField({
      currentPhotoUrl,
      currentPhotoViewUrl,
      previewUrl,
      fileName,
      sizeLabel,
      onPhotoSelected,
      onPhotoRemoved
    }) {
      const inputRef = useRef(null);
      const [dragging, setDragging] = useState(false);
      const [processing, setProcessing] = useState(false);
      const [error, setError] = useState('');

      async function handleFiles(files) {
        const file = files && files[0] ? files[0] : null;

        if (!file) return;

        setError('');

        if (PHOTO_ACCEPT_TYPES.indexOf(file.type) === -1) {
          setError('Only JPG, PNG, or WEBP images are allowed.');
          return;
        }

        setProcessing(true);

        try {
          const compressed = await compressImageFile(file);

          if (compressed.sizeBytes > PHOTO_MAX_COMPRESSED_BYTES) {
            setError(
              'Compressed photo is still too large (' +
              formatBytes(compressed.sizeBytes) +
              '). Please choose a smaller image.'
            );
            return;
          }

          onPhotoSelected(compressed);
        } catch (error) {
          setError(error.message || 'Failed to process image.');
        } finally {
          setProcessing(false);
        }
      }

      function openFilePicker() {
        if (inputRef.current) {
          inputRef.current.click();
        }
      }

      function handleDrop(event) {
        event.preventDefault();
        event.stopPropagation();
        setDragging(false);

        if (event.dataTransfer.files && event.dataTransfer.files.length > 0) {
          handleFiles(event.dataTransfer.files);
        }
      }

      function handleDragEnter(event) {
        event.preventDefault();
        event.stopPropagation();
        setDragging(true);
      }

      function handleDragOver(event) {
        event.preventDefault();
        event.stopPropagation();
        setDragging(true);
      }

      function handleDragLeave(event) {
        event.preventDefault();
        event.stopPropagation();

        if (!event.currentTarget.contains(event.relatedTarget)) {
          setDragging(false);
        }
      }

      const hasPhoto = Boolean(currentPhotoUrl || previewUrl);

      return (
        <Field label="Photo Proof">
          <div
            onDrop={handleDrop}
            onDragEnter={handleDragEnter}
            onDragOver={handleDragOver}
            onDragLeave={handleDragLeave}
            className={
              'rounded-3xl border-2 border-dashed p-5 transition ' +
              (
                dragging
                  ? 'border-slate-950 bg-slate-100 dark:border-white dark:bg-slate-800'
                  : 'border-slate-300 bg-slate-50 dark:border-slate-700 dark:bg-slate-950'
              )
            }
          >
            <input
              ref={inputRef}
              type="file"
              accept="image/jpeg,image/png,image/webp"
              className="hidden"
              onChange={event => {
                handleFiles(event.target.files);
                event.target.value = null;
              }}
            />

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-center pointer-events-none">
              <div className="md:col-span-2">
                <p className="text-sm font-black text-slate-800 dark:text-slate-100">
                  Drag & drop photo here
                </p>

                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                  Or choose an image file. It will be compressed first, then uploaded to Google Drive before the item is saved.
                </p>

                {fileName && (
                  <p className="text-xs font-bold text-green-600 dark:text-green-300 mt-2 pointer-events-auto">
                    {previewUrl ? 'Selected' : 'Attached'}: {fileName} {sizeLabel ? `· ${sizeLabel}` : ''}
                  </p>
                )}

                {currentPhotoUrl && !previewUrl && (
                  <p className="text-xs font-bold text-blue-600 dark:text-blue-300 mt-2 pointer-events-auto">
                    Existing Drive photo is attached.
                  </p>
                )}

                {error && (
                  <p className="text-xs font-bold text-red-600 dark:text-red-300 mt-2 pointer-events-auto">
                    {error}
                  </p>
                )}

                <div className="flex flex-wrap gap-2 mt-4 pointer-events-auto">
                  <button
                    type="button"
                    onClick={openFilePicker}
                    disabled={processing}
                    className="rounded-2xl bg-slate-950 px-4 py-2 text-xs font-black text-white hover:bg-slate-800 disabled:opacity-60 dark:bg-white dark:text-slate-950 dark:hover:bg-slate-200"
                  >
                    {processing ? 'Compressing...' : 'Choose File'}
                  </button>

                  {hasPhoto && (
                    <button
                      type="button"
                      onClick={onPhotoRemoved}
                      className="rounded-2xl border border-red-200 bg-red-50 px-4 py-2 text-xs font-black text-red-700 hover:bg-red-100 dark:border-red-500/20 dark:bg-red-500/10 dark:text-red-300"
                    >
                      Remove Photo
                    </button>
                  )}

                  {currentPhotoUrl && (
                    <a
                      href={currentPhotoUrl || currentPhotoViewUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="rounded-2xl border border-slate-300 bg-white px-4 py-2 text-xs font-black text-slate-700 hover:bg-slate-100 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800"
                    >
                      Open Existing
                    </a>
                  )}
                </div>
              </div>

              <div className="rounded-2xl border border-slate-200 bg-white p-2 min-h-[120px] flex items-center justify-center dark:border-slate-800 dark:bg-slate-900 pointer-events-auto">
                {previewUrl ? (

                  />
                ) : currentPhotoViewUrl ? (
                  <img
                    src={currentPhotoViewUrl}

                  />
                ) : currentPhotoUrl ? (
                  <div className="text-center">
                    <div className="mx-auto mb-2 flex h-12 w-12 items-center justify-center rounded-2xl bg-blue-50 text-blue-700 dark:bg-blue-500/10 dark:text-blue-300">
                      📎
                    </div>
                    <p className="text-xs font-bold text-slate-500 dark:text-slate-400">

                  </div>
                ) : (
                  <div className="text-center">
                    <div className="mx-auto mb-2 flex h-12 w-12 items-center justify-center rounded-2xl bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-300">
                      +
                    </div>
                    <p className="text-xs font-bold text-slate-400">
                      No photo
                    </p>
                  </div>
                )}
              </div>
            </div>
          </div>
        </Field>
      );
    }

    function buildDriveViewUrl(fileId) {
      fileId = String(fileId || '').trim();

      if (!fileId) return '';

      return 'https://drive.google.com/uc?export=view&id=' + encodeURIComponent(fileId);
    }

    function extractDriveFileIdFromUrl(url) {
      url = String(url || '').trim();

      if (!url) return '';

      let match = url.match(/\/file\/d\/([^/]+)/);

      if (match && match[1]) {
        return match[1];
      }

      match = url.match(/[?&]id=([^&]+)/);

      if (match && match[1]) {
        return decodeURIComponent(match[1]);
      }

      return '';
    }

    function writeCache(key, data) {
      try {
        localStorage.setItem(key, JSON.stringify({
          savedAt: Date.now(),
          data: data
        }));
      } catch (error) {
        console.warn('Cache write failed', error);
      }
    }

    function readCache(key) {
      try {
        const raw = localStorage.getItem(key);

        if (!raw) return null;

        const parsed = JSON.parse(raw);

        if (!parsed || !parsed.savedAt) return null;

        const isExpired = Date.now() - parsed.savedAt > CACHE_TTL_MS;

        if (isExpired) {
          localStorage.removeItem(key);
          return null;
        }

        return parsed.data || null;

      } catch (error) {
        localStorage.removeItem(key);
        return null;
      }
    }

    function formatLocalDate(date) {
      const year = date.getFullYear();

    function normalizeDateOnly(value) {

    function buildCalendarDays(monthValue) {
      const [year, month] = monthValue.split('-').map(Number);
      const firstDate = new Date(year, month - 1, 1);
      const lastDate = new Date(year, month, 0);
      const startDay = firstDate.getDay();
      const totalDays = lastDate.getDate();

      const days = [];

      for (let i = 0; i < startDay; i++) {
        days.push({
          date: '',
          dayNumber: ''
        });
      }

      for (let day = 1; day <= totalDays; day++) {
        const date = new Date(year, month - 1, day);

        days.push({
          date: formatLocalDate(date),
          dayNumber: day
        });
      }

      while (days.length % 7 !== 0) {
        days.push({
          date: '',
          dayNumber: ''
        });
      }

      return days;
    }

    function formatDisplayDate(value) {
      if (!value) return '-';

      const [year, month, day] = value.split('-').map(Number);
      const date = new Date(year, month - 1, day);

      return date.toLocaleDateString('en-US', {
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    function formatCurrency(value) {
      const numberValue = Number(value || 0);

      return new Intl.NumberFormat('id-ID', {

        currency: 'IDR',
        maximumFractionDigits: 0
      }).format(numberValue);
    }

    function formatCurrencyCompact(value) {
      const numberValue = Number(value || 0);

      if (Math.abs(numberValue) >= 1000000) {
        return 'Rp' + (numberValue / 1000000).toFixed(1) + 'jt';
      }

      if (Math.abs(numberValue) >= 1000) {
        return 'Rp' + (numberValue / 1000).toFixed(0) + 'rb';
      }

      return 'Rp' + numberValue.toFixed(0);
    }

    function formatBytes(bytes) {
      const numberValue = Number(bytes || 0);

      if (numberValue >= 1024 * 1024) {
        return (numberValue / (1024 * 1024)).toFixed(2) + ' MB';
      }

      if (numberValue >= 1024) {
        return (numberValue / 1024).toFixed(1) + ' KB';
      }

      return numberValue + ' B';
    }

    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onerror = () => reject(new Error('Failed to read image file.'));

        reader.onload = event => {
          const image = new Image();

          image.onerror = () => reject(new Error('Invalid image file.'));

          image.onload = () => {
            try {
              let finalResult = null;

              for (let i = 0; i < PHOTO_COMPRESSION_ATTEMPTS.length; i++) {
                const attempt = PHOTO_COMPRESSION_ATTEMPTS[i];
                const dimensions = calculateImageDimensions(
                  image.width,
                  image.height,
                  attempt.maxWidth,
                  attempt.maxHeight
                );

                const canvas = document.createElement('canvas');
                canvas.width = dimensions.width;
                canvas.height = dimensions.height;

                const context = canvas.getContext('2d');

                if (!context) {
                  throw new Error('Image compression is not supported in this browser.');
                }

                context.drawImage(image, 0, 0, dimensions.width, dimensions.height);

                const outputMimeType = 'image/jpeg';
                const dataUrl = canvas.toDataURL(outputMimeType, attempt.quality);
                const base64Data = dataUrl.split(',')[1] || '';
                const sizeBytes = estimateBase64Bytes(base64Data);
                const safeFileName = buildCompressedFileName(file.name);

                finalResult = {
                  base64Data: base64Data,
                  mimeType: outputMimeType,
                  fileName: safeFileName,
                  previewUrl: dataUrl,
                  sizeBytes: sizeBytes,
                  width: dimensions.width,
                  height: dimensions.height,
                  quality: attempt.quality
                };

                if (sizeBytes <= PHOTO_MAX_COMPRESSED_BYTES) {
                  resolve(finalResult);
                  return;
                }
              }

              reject(new Error(
                'Photo is too large even after compression. Maximum compressed size is ' +
                formatBytes(PHOTO_MAX_COMPRESSED_BYTES) +
                '. Last result: ' +
                formatBytes(finalResult ? finalResult.sizeBytes : 0) +
                '.'
              ));

            } catch (error) {
              reject(error);
            }
          };

          image.src = event.target.result;
        };

        reader.readAsDataURL(file);
      });
    }

    function calculateImageDimensions(width, height, maxWidth, maxHeight) {
      let nextWidth = width;
      let nextHeight = height;

      if (nextWidth > maxWidth) {
        nextHeight = Math.round(nextHeight * (maxWidth / nextWidth));
        nextWidth = maxWidth;
      }

      if (nextHeight > maxHeight) {
        nextWidth = Math.round(nextWidth * (maxHeight / nextHeight));
        nextHeight = maxHeight;
      }

      return {
        width: nextWidth,
        height: nextHeight
      };
    }

    function estimateBase64Bytes(base64Data) {
      const clean = String(base64Data || '').replace(/=/g, '');
      return Math.floor(clean.length * 0.75);
    }

    function buildCompressedFileName(originalName) {
      const cleanName = String(originalName || 'inventory-photo')
        .replace(/\.[^.]+$/, '')
        .replace(/\s+/g, '-')
        .replace(/[^a-zA-Z0-9-_]/g, '')
        .substring(0, 70) || 'inventory-photo';

      return cleanName + '-compressed.jpg';
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
